<!doctype html>
<html lang="en" data-theme="dark">
    <head>
        <meta charset="UTF-8" />
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content"
        />
        <meta name="theme-color" content="#000000" />
        <meta name="mobile-web-app-capable" content="yes" />
        <meta name="apple-mobile-web-app-capable" content="yes" />
        <!-- "black", not "black-translucent": the translucent style lets iOS 26 draw its own gradient scrim over the
             top of the page (it cannot be turned off from the page) and, on the iPhones it was seen on, sized the
             page 62px short of the screen so the system background showed under the bar. "black" is a solid black
             bar with the page below it. iOS reads this once, when the app is added to the Home Screen. -->
        <meta name="apple-mobile-web-app-status-bar-style" content="black" />
        <meta name="apple-mobile-web-app-title" content="PiKVM" />
        <link rel="manifest" href="/app/manifest.webmanifest" />
        <link rel="apple-touch-icon" href="/app/apple-touch-icon.png" />
        <link rel="icon" href="/app/icon-192.png" />
        <title>PiKVM</title>
        <script>
            // Runs before first paint so a light-theme user never sees a dark flash. The rule
            // matches the console's: a saved choice wins, otherwise follow the OS.
            try {
                var t = localStorage.getItem("pikvm-console-theme");
                if (t !== "light" && t !== "dark") {
                    t = matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
                }
                document.documentElement.setAttribute("data-theme", t);
                document.documentElement.classList.toggle("dark", t === "dark");
            } catch (e) {}
        </script>
        <script>
            // Decided once, before first paint, so the first frame already has the right height and top edge.
            // Standalone (the installed app: no URL bar) has the full screen as its large viewport, which is
            // what 100vh is; 100dvh and the visual viewport report the screen minus an inset when it starts.
            // src/app/standalone.ts has the same rule for the case this script did not run.
            try {
                var standalone =
                    navigator.standalone === true ||
                    matchMedia("(display-mode: standalone)").matches ||
                    matchMedia("(display-mode: fullscreen)").matches;
                if (standalone) document.documentElement.setAttribute("data-standalone", "true");
                if (navigator.standalone === true) document.documentElement.setAttribute("data-ios-standalone", "true");
            } catch (e) {}
        </script>
    </head>
    <body>
        <div id="status-edge" aria-hidden="true"></div>
        <div id="root"></div>
        <script type="module" src="/src/main.tsx"></script>
    </body>
</html>
