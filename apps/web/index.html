<!doctype html>
<html lang="en" data-theme="dark">
    <head>
        <meta charset="UTF-8" />
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content"
        />
        <meta name="theme-color" content="#000000" />
        <meta name="mobile-web-app-capable" content="yes" />
        <meta name="apple-mobile-web-app-capable" content="yes" />
        <!-- "black", not "black-translucent": the translucent style lets iOS 26 draw its own gradient scrim over the
             top of the page (it cannot be turned off from the page) and, on the iPhones it was seen on, sized the
             page 62px short of the screen so the system background showed under the bar. "black" is a solid black
             bar with the page below it. iOS reads this once, when the app is added to the Home Screen. -->
        <meta name="apple-mobile-web-app-status-bar-style" content="black" />
        <meta name="apple-mobile-web-app-title" content="PiKVM" />
        <link rel="manifest" href="/app/manifest.webmanifest" />
        <link rel="apple-touch-icon" href="/app/apple-touch-icon.png" />
        <link rel="icon" href="/app/icon-192.png" />
        <title>PiKVM</title>
        <script>
            // Runs before first paint so a light-theme user never sees a dark flash. The rule
            // matches the console's: a saved choice wins, otherwise follow the OS.
            try {
                var t = localStorage.getItem("pikvm-console-theme");
                if (t !== "light" && t !== "dark") {
                    t = matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
                }
                document.documentElement.setAttribute("data-theme", t);
                document.documentElement.classList.toggle("dark", t === "dark");
                // The system's status area follows the page (app/status-colour.ts has the same rule): black over the KVM,
                // the page's own colour on Chat and Settings. Right for the route it opens on, before first paint.
                var status = /^\/app\/(chat|settings)(\/|$)/.test(location.pathname) ? (t === "light" ? "#eef0f4" : "#0a0a0c") : "#000000";
                document.documentElement.style.setProperty("--status-colour", status);
                document.querySelector('meta[name="theme-color"]').setAttribute("content", status);
            } catch (e) {}
        </script>
        <script>
            // Decided once, before first paint, so the first frame already has the right height and top edge.
            // Standalone means the MANIFEST's display mode applies (display-mode standalone or fullscreen): the app iOS
            // made from Safari, with no URL bar, where 100vh is the whole screen and 100dvh and the visual viewport
            // report the screen minus an inset when it starts. navigator.standalone alone is not that: a home-screen
            // app made by Firefox on iOS has it true with display-mode browser, no manifest read, a default status bar
            // above the page and a web view 62px shorter than 100vh, so it takes the plain browser layout.
            // src/app/standalone.ts has the same rule for the case this script did not run.
            try {
                var standalone = matchMedia("(display-mode: standalone)").matches || matchMedia("(display-mode: fullscreen)").matches;
                // An iPhone or iPad is told by what it says it is (navigator.standalone included, for data-ios below).
                var ios =
                    navigator.standalone === true ||
                    /iPhone|iPad|iPod/.test(navigator.userAgent) ||
                    (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
                if (standalone) document.documentElement.setAttribute("data-standalone", "true");
                if (standalone && ios) document.documentElement.setAttribute("data-ios-standalone", "true");
                // Any iPhone or iPad, tab or installed: the type tokens use the system text styles under it (styles.css).
                if (ios) document.documentElement.setAttribute("data-ios", "true");
            } catch (e) {}
        </script>
    </head>
    <body>
        <div id="status-edge" aria-hidden="true"></div>
        <div id="root"></div>
        <script type="module" src="/src/main.tsx"></script>
    </body>
</html>
