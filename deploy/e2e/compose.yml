# The hosted deployment on one machine, with nothing real in it: the one image this repo builds
# (deploy/Dockerfile), a fake kvmd standing in for the PiKVM and a scripted model standing in for
# a provider. docs/e2e/ records a run.
#
#   make image                               # builds pikvm-kvm:local from deploy/Dockerfile
#   podman compose -f deploy/e2e/compose.yml up -d
#   open http://127.0.0.1:18080/app/chat
#
# KVM_HOST_PORT, FAKE_KVMD_PORT and FAKE_MODEL_PORT move the published ports (defaults 18080, 14510, 19090).
#
# In the chat's Settings, add a provider with base URL http://fake-model:9000/v1 and any key; the
# gateway accepts any operator-configured base URL. The web host listens on 127.0.0.1 only here
# (PIKVM_AUTH=proxy states that an authenticating proxy is in front, which on this machine is
# "nobody can reach it").
services:
    fake-kvmd:
        image: docker.io/library/node:22-bookworm-slim
        init: true
        working_dir: /repo
        command: ["node", "--experimental-strip-types", "--disable-warning=ExperimentalWarning", "tools/fake-kvmd/server.ts", "--host", "0.0.0.0", "--port", "4510"]
        volumes:
            - ../..:/repo:ro
        # Fedora's SELinux refuses a bind mount of the checkout without a relabel.
        security_opt: ["label=disable"]
        ports:
            # The browser run reads back what the fake received (/__fake/hid).
            - "127.0.0.1:${FAKE_KVMD_PORT:-14510}:4510"
        networks: [kvm-internal]

    fake-model:
        image: docker.io/library/node:22-bookworm-slim
        init: true
        working_dir: /repo
        environment:
            HOST: 0.0.0.0
            PORT: "9000"
        command: ["node", "--experimental-strip-types", "--disable-warning=ExperimentalWarning", "tools/fake-model/server.ts"]
        volumes:
            - ../..:/repo:ro
        security_opt: ["label=disable"]
        ports:
            # The browser run reads back what the agent sent (the credentials, the tool list).
            - "127.0.0.1:${FAKE_MODEL_PORT:-19090}:9000"
        networks: [kvm-internal]

    # A push service of its own: an endpoint per device, and what was sent to it decrypted (apps/web/e2e/watch.e2e.mjs). It binds to
    # its own name so that the endpoints it hands out are http://fake-push:14720/..., which the kvm container can reach.
    fake-push:
        image: docker.io/library/node:22-bookworm-slim
        init: true
        working_dir: /repo
        command: ["node", "--experimental-strip-types", "--disable-warning=ExperimentalWarning", "tools/fake-push/server.ts", "--host", "fake-push", "--port", "14720"]
        volumes:
            - ../..:/repo:ro
        security_opt: ["label=disable"]
        ports:
            - "127.0.0.1:${FAKE_PUSH_PORT:-14720}:14720"
        networks: [kvm-internal]

    fake-openrouter:
        image: docker.io/library/node:22-bookworm-slim
        init: true
        working_dir: /repo
        command: ["node", "--experimental-strip-types", "--disable-warning=ExperimentalWarning", "tools/fake-openrouter/server.ts", "--host", "0.0.0.0", "--port", "14730"]
        volumes:
            - ../..:/repo:ro
        security_opt: ["label=disable"]
        ports:
            - "127.0.0.1:${FAKE_OPENROUTER_PORT:-14730}:14730"
        networks: [kvm-internal]

    kvm:
        image: ${KVM_IMAGE:-pikvm-kvm:local}
        environment:
            PIKVM_URL: http://fake-kvmd:4510
            PIKVM_USER: admin
            PIKVM_PASSWORD: anything
            PIKVM_AUTH: proxy
            PORT: "8080"
        ports:
            - "127.0.0.1:${KVM_HOST_PORT:-18080}:8080"
        volumes:
            - kvm-data:/data
        networks: [kvm-internal]
        depends_on: [fake-kvmd, fake-model]
        # As on bsociety: nothing in the image needs a writable root or a capability.
        read_only: true
        tmpfs: [/tmp]
        cap_drop: [ALL]
        security_opt: ["no-new-privileges:true"]

networks:
    kvm-internal:

volumes:
    kvm-data:
