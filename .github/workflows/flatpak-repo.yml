name: flatpak-repo

# Publishes the Flatpak repository on GitHub Pages, so `flatpak update` finds new releases. It takes the
# .flatpak bundles from a GitHub Release, imports them into one OSTree repository and signs the commits with the
# repository key (secrets FLATPAK_GPG_PRIVATE_KEY and FLATPAK_GPG_KEY_ID; the public half is
# packaging/flatpak-repo.gpg.b64 and goes into the .flatpakrepo file). scripts/flatpak-repo.sh does the work.
#
# package.yml calls this after it has published a release. Run it by hand for a release that already exists:
#   gh workflow run flatpak-repo.yml -f tag=v1.14.1 -f dry_run=true
# A dry run builds everything and keeps the repository and the rebuilt bundles as a workflow artifact, but changes
# neither the release nor the Pages site.

on:
  workflow_call:
    inputs:
      tag:
        description: The release tag whose .flatpak files go into the repository
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: The release tag whose .flatpak files go into the repository
        required: true
        type: string
      dry_run:
        description: Build only; keep the result as an artifact, do not touch the release or Pages
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

# One deploy at a time, and a later release never loses to an earlier one still running.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    name: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      # The triggering commit: the tag's own tree when package.yml calls this, main's when it is run by hand
      # for an older release (whose tree has no scripts/flatpak-repo.sh).
      - uses: actions/checkout@v4
      - name: Install flatpak and ostree
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends flatpak ostree gnupg appstream
          # Ubuntu ships the compose command in its own package; the build needs it, so check it is there.
          sudo apt-get install -y --no-install-recommends appstream-compose || true
          appstreamcli compose --help >/dev/null
      - name: Download the release's Flatpak bundles
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir bundles
          gh release download "${{ inputs.tag }}" --repo "$GITHUB_REPOSITORY" --pattern '*.flatpak' --dir bundles
          ls -la bundles
      - name: Import the signing key
        env:
          FLATPAK_GPG_PRIVATE_KEY: ${{ secrets.FLATPAK_GPG_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          home="$RUNNER_TEMP/gnupg"
          mkdir -m 700 "$home"
          printf '%s\n' "$FLATPAK_GPG_PRIVATE_KEY" | gpg --homedir "$home" --batch --import
          echo "FLATPAK_GPG_HOME=$home" >>"$GITHUB_ENV"
      - name: Build the repository
        env:
          FLATPAK_GPG_KEY_ID: ${{ secrets.FLATPAK_GPG_KEY_ID }}
          TAG: ${{ inputs.tag }}
        run: |
          export RELEASE_VERSION="${TAG#v}"
          scripts/flatpak-repo.sh bundles site "https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}"
          du -sh site site-bundles
      - name: Keep the result for inspection (dry run)
        if: ${{ inputs.dry_run }}
        uses: actions/upload-artifact@v4
        with:
          name: flatpak-repo-dry-run
          path: |
            site
            site-bundles
      # The release's .flatpak files are replaced by ones that carry the repository's address and key, so a file
      # installed from the release page keeps updating through `flatpak update`.
      - name: Replace the release's Flatpak bundles with ones that know their repository
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ inputs.tag }}" site-bundles/*.flatpak --repo "$GITHUB_REPOSITORY" --clobber
      - if: ${{ !inputs.dry_run }}
        uses: actions/configure-pages@v5
      - if: ${{ !inputs.dry_run }}
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        if: ${{ !inputs.dry_run }}
        uses: actions/deploy-pages@v4
