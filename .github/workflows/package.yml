name: package

# Builds PiKVM Desktop on each operating system. electron-packager writes the Electron tree on every
# one; what packages it differs:
#
#   linux   pkgsmith (https://github.com/kierandrewett/pkgsmith; pkgsmith.star at the repo root):
#           rpm, deb, Arch, AppImage, Flatpak                     (x64 and arm64)
#   macos   electron-builder (packaging/electron-builder.yml): dmg, zip   (arm64 and x64)
#   windows electron-builder (packaging/electron-builder.yml): nsis, msi, zip (x64)
#
# Each package carries omp's standalone binary for its target (scripts/fetch-omp.mjs, pinned and
# sha256-checked by deploy/omp.lock): that is the agent, with no Python and no Bun. The image job
# builds deploy/Dockerfile, the one image of the headless host and its agent.
#
# Packages are unsigned: no Apple notarisation, no Authenticode, no package signing key.
#
# A pushed tag v* also publishes them: the release job attaches every platform's packages to a GitHub
# Release named after the tag. Branch pushes and pull requests only keep them as Actions artifacts.

on:
  push:
    branches: [main, feat/app-rebuild]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-x64, runner: ubuntu-24.04, platform: linux, arch: x64 }
          - { name: linux-arm64, runner: ubuntu-24.04-arm, platform: linux, arch: arm64 }
          - { name: macos-arm64, runner: macos-15, platform: darwin, arch: arm64 }
          - { name: macos-x64, runner: macos-15-intel, platform: darwin, arch: x64 }
          - { name: windows-x64, runner: windows-2025, platform: win32, arch: x64 }
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the package release is the commit count

      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: yarn install --immutable

      # Linux packages only: pkgsmith has no release yet, so it is built from source (its plugins sit
      # next to the binary), and flatpak writes the Flatpak bundle. macOS and Windows installers need
      # neither: electron-builder (a devDependency) brings its own dmg, NSIS and WiX tooling.
      - uses: dtolnay/rust-toolchain@stable
        if: matrix.platform == 'linux'
      - name: Build pkgsmith
        if: matrix.platform == 'linux'
        run: |
          git clone --depth 1 https://github.com/kierandrewett/pkgsmith "$RUNNER_TEMP/pkgsmith"
          cargo build --release --workspace --manifest-path "$RUNNER_TEMP/pkgsmith/Cargo.toml"
          echo "PKGSMITH=$RUNNER_TEMP/pkgsmith/target/release/pkgsmith" >> "$GITHUB_ENV"
      - name: Install flatpak
        if: matrix.platform == 'linux'
        run: sudo apt-get update && sudo apt-get install -y flatpak

      - name: Package
        run: node scripts/package.mjs --platform ${{ matrix.platform }} --arch ${{ matrix.arch }}

      - uses: actions/upload-artifact@v4
        with:
          name: pikvm-desktop-${{ matrix.name }}
          path: builds/packages/${{ matrix.platform }}-${{ matrix.arch }}/*
          if-no-files-found: error

  image:
    name: image
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Build deploy/Dockerfile
        run: docker build -f deploy/Dockerfile -t pikvm-kvm:ci .
      - name: The image starts read-only as an unprivileged user and answers its healthcheck
        run: |
          docker run -d --name kvm --read-only --tmpfs /tmp --cap-drop ALL --security-opt no-new-privileges:true \
            -e PIKVM_URL=http://127.0.0.1:9 -e PIKVM_PASSWORD=x -e PIKVM_AUTH=proxy -p 127.0.0.1:8080:8080 pikvm-kvm:ci
          for _ in $(seq 30); do
            curl -fsS -o /dev/null http://127.0.0.1:8080/app/login && exit 0
            sleep 1
          done
          docker logs kvm
          exit 1

  release:
    name: release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [package, image]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      # One directory per build (pikvm-desktop-linux-x64, ...): two builds may name a file the same (a
      # Flatpak bundle, say), and a release cannot hold two assets of one name.
      - uses: actions/download-artifact@v4
        with:
          pattern: pikvm-desktop-*
          path: packages
      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir assets
          # A name that more than one build produced gets its build in front, on every copy.
          dupes="$(find packages -mindepth 2 -maxdepth 2 -type f -printf '%f\n' | sort | uniq -d)"
          for dir in packages/pikvm-desktop-*; do
            build="${dir#packages/pikvm-desktop-}"
            for file in "$dir"/*; do
              name="$(basename "$file")"
              if grep -qxF "$name" <<<"$dupes"; then name="$build-$name"; fi
              cp "$file" "assets/$name"
            done
          done
          ls -la assets
          gh release create "$GITHUB_REF_NAME" assets/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            --verify-tag
