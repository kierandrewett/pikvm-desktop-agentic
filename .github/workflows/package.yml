name: package

# Builds PiKVM Desktop on each operating system. electron-packager writes the Electron tree on every
# one; what packages it differs:
#
#   linux   pkgsmith (https://github.com/kierandrewett/pkgsmith; pkgsmith.star at the repo root):
#           rpm, deb, Arch, AppImage, Flatpak                     (x64 and arm64)
#   macos   electron-builder (packaging/electron-builder.yml): dmg, zip   (arm64 and x64)
#   windows electron-builder (packaging/electron-builder.yml): nsis, msi, zip (x64)
#
# pkgsmith comes from its GitHub release, pinned by version and sha256 below. Each package carries omp's
# standalone binary for its target (scripts/fetch-omp.mjs, pinned and sha256-checked by deploy/omp.lock): that is
# the agent, with no Python and no Bun. The image job builds deploy/Dockerfile, the one image of the headless
# host and its agent.
#
# The installers are unsigned: no Apple notarisation, no Authenticode. The Flatpak repository is the one
# exception: flatpak-repo.yml signs it with its own key, because Flatpak clients verify what they update from.
#
# A pushed tag v* also publishes. There is no release job to wait for: each build attaches its own packages to the
# GitHub Release as soon as it has them (scripts/ci-publish.sh), the first one to finish creating the release, so a
# slow runner holds nothing back. The Flatpak repository on GitHub Pages follows as soon as both Linux builds are
# on the release. The image job does not gate the release. Branch pushes and pull requests only keep the packages
# as Actions artifacts; a newer push replaces the run still going for the same branch.
#
# Test the publishing without a tag: run this workflow by hand with `test_release` set to a throwaway name. Every
# build then publishes to a pre-release of that tag (made on the spot) and the Flatpak repository is
# skipped. Delete the release and its tag afterwards.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      test_release:
        description: Publish every build to a pre-release of this throwaway tag (a test; delete the release and tag afterwards)
        required: false
        default: ""
        type: string

concurrency:
  group: package-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

env:
  # The release this run publishes to: the pushed tag, or a test run's throwaway tag. Empty for a branch or pull request.
  RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || inputs.test_release }}
  RELEASE_TEST: ${{ github.event_name == 'workflow_dispatch' && inputs.test_release != '' }}

jobs:
  linux:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            runner: ubuntu-24.04
            arch: x64
            pkgsmith-target: x86_64-unknown-linux-gnu
            pkgsmith-sha256: 0b483e723741e0d2445cf24514902da0b57c2840a69957a2194729ed6b3924c4
          - name: linux-arm64
            runner: ubuntu-24.04-arm
            arch: arm64
            pkgsmith-target: aarch64-unknown-linux-gnu
            pkgsmith-sha256: dbe1cde0e6ce6ba92edc7a1d603991981acd9dc94fbd28e8326f0a2263a44e38
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the package release is the commit count
      - uses: ./.github/actions/package
        with:
          platform: linux
          arch: ${{ matrix.arch }}
          name: ${{ matrix.name }}
          pkgsmith-version: v0.1.1
          pkgsmith-target: ${{ matrix.pkgsmith-target }}
          pkgsmith-sha256: ${{ matrix.pkgsmith-sha256 }}
          token: ${{ github.token }}

  other:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macos-arm64, runner: macos-15, platform: darwin, arch: arm64 }
          - { name: macos-x64, runner: macos-15-intel, platform: darwin, arch: x64 }
          - { name: windows-x64, runner: windows-2025, platform: win32, arch: x64 }
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the package release is the commit count
      - uses: ./.github/actions/package
        with:
          platform: ${{ matrix.platform }}
          arch: ${{ matrix.arch }}
          name: ${{ matrix.name }}
          token: ${{ github.token }}

  image:
    name: image
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Build deploy/Dockerfile
        run: docker build -f deploy/Dockerfile -t pikvm-kvm:ci .
      - name: The image starts read-only as an unprivileged user and answers its healthcheck
        run: |
          docker run -d --name kvm --read-only --tmpfs /tmp --cap-drop ALL --security-opt no-new-privileges:true \
            -e PIKVM_URL=http://127.0.0.1:9 -e PIKVM_PASSWORD=x -e PIKVM_ACCESS_TOKEN=ci-smoke-token-0123456789abcdef -p 127.0.0.1:8080:8080 pikvm-kvm:ci
          for _ in $(seq 30); do
            curl -fsS -o /dev/null http://127.0.0.1:8080/app/login && exit 0
            sleep 1
          done
          docker logs kvm
          exit 1

  # The Flatpak repository on GitHub Pages, so `flatpak update` finds this release (flatpak-repo.yml). It reads the
  # two Flatpak bundles off the release, so it starts as soon as both Linux builds have attached them.
  flatpak-repo:
    name: flatpak repository
    if: startsWith(github.ref, 'refs/tags/v')
    needs: linux
    permissions:
      contents: write
      pages: write
      id-token: write
    uses: ./.github/workflows/flatpak-repo.yml
    with:
      tag: ${{ github.ref_name }}
    secrets: inherit
