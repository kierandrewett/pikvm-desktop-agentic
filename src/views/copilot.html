<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <style>
            :root { color-scheme: dark; }
            * { margin: 0; padding: 0; box-sizing: border-box; }
            html, body { background: transparent; overflow: hidden; }
            body {
                font-family: -apple-system, system-ui, "Segoe UI", sans-serif;
                -webkit-user-select: none;
                user-select: none;
            }
            #card {
                width: 340px;
                border-radius: 14px;
                background: rgba(20, 22, 28, 0.92);
                backdrop-filter: blur(12px);
                border: 1px solid rgba(16, 185, 129, 0.35);
                box-shadow: 0 16px 40px rgba(0, 0, 0, 0.55);
                color: #e7e9ee;
                overflow: hidden;
            }
            #head {
                display: flex;
                align-items: center;
                gap: 8px;
                padding: 9px 11px;
                cursor: grab;
                border-bottom: 1px solid rgba(255, 255, 255, 0.06);
            }
            #head:active { cursor: grabbing; }
            .dot { position: relative; width: 8px; height: 8px; }
            .dot span { position: absolute; inset: 0; border-radius: 50%; background: #10b981; }
            .dot .ping { animation: ping 1.4s cubic-bezier(0,0,0.2,1) infinite; opacity: 0.6; }
            @keyframes ping { 75%, 100% { transform: scale(2.2); opacity: 0; } }
            #title { font-size: 13px; font-weight: 600; }
            #sub { font-size: 11px; color: #8b90a0; }
            #head .right { margin-left: auto; display: flex; gap: 2px; }
            .iconbtn {
                background: none; border: none; color: #8b90a0; cursor: pointer;
                border-radius: 6px; padding: 3px 5px; font-size: 13px; line-height: 1;
            }
            .iconbtn:hover { color: #e7e9ee; background: rgba(255,255,255,0.08); }
            #body { padding: 9px 11px; max-height: 300px; overflow: auto; }
            .sug {
                font-size: 13px; line-height: 1.4; white-space: pre-wrap;
                border-radius: 9px; padding: 8px 10px; margin-bottom: 6px;
                border: 1px solid rgba(255,255,255,0.07); background: rgba(255,255,255,0.03); color: #c7ccd8;
            }
            .sug.latest { border-color: rgba(16,185,129,0.4); background: rgba(16,185,129,0.1); color: #e7e9ee; }
            .sug .q { color: #8b90a0; font-size: 11px; display: block; margin-bottom: 2px; }
            #empty { font-size: 12px; color: #8b90a0; padding: 4px 2px; }
            #ticker {
                font-size: 11px; color: #777c8c; font-style: italic; line-height: 1.4;
                border-top: 1px solid rgba(255,255,255,0.06); padding-top: 7px; margin-top: 2px;
            }
            #foot { display: flex; gap: 6px; padding: 9px 11px; border-top: 1px solid rgba(255,255,255,0.06); }
            #ask {
                flex: 1; min-width: 0; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1);
                border-radius: 8px; color: #e7e9ee; font-size: 12px; padding: 6px 8px; outline: none;
            }
            #ask:focus { border-color: rgba(16,185,129,0.5); }
            #now {
                background: #10b981; border: none; color: #04130d; font-weight: 600; font-size: 12px;
                border-radius: 8px; padding: 6px 10px; cursor: pointer; white-space: nowrap;
            }
            #now:hover { background: #0fbf86; }
            #now:disabled { opacity: 0.5; cursor: default; }
        </style>
    </head>
    <body>
        <div id="card">
            <div id="head">
                <span class="dot"><span class="ping"></span><span></span></span>
                <div>
                    <div id="title">Meeting copilot</div>
                    <div id="sub">live</div>
                </div>
                <div class="right">
                    <button class="iconbtn" id="min" title="Collapse">▾</button>
                    <button class="iconbtn" id="close" title="Dismiss">✕</button>
                </div>
            </div>
            <div id="body">
                <div id="sugs"><div id="empty">Listening… suggestions will appear as the meeting unfolds.</div></div>
                <div id="ticker" style="display:none"></div>
            </div>
            <div id="foot">
                <input id="ask" placeholder="Ask the copilot…" />
                <button id="now">Suggest now</button>
            </div>
        </div>
        <script>
            const base = window.copilot.base;
            const card = document.getElementById("card");
            const sugsEl = document.getElementById("sugs");
            const tickerEl = document.getElementById("ticker");
            const askEl = document.getElementById("ask");
            const nowBtn = document.getElementById("now");
            const body = document.getElementById("body");
            const foot = document.getElementById("foot");

            let suggestions = [];
            let transcript = "";
            let collapsed = false;

            function render() {
                if (!suggestions.length) {
                    sugsEl.innerHTML = '<div id="empty">Listening… suggestions will appear as the meeting unfolds.</div>';
                } else {
                    sugsEl.innerHTML = suggestions
                        .slice(0, 4)
                        .map((s, i) => {
                            const m = s.text.match(/^Q:\s*(.+?)\n([\s\S]*)$/);
                            const inner = m
                                ? '<span class="q">↳ ' + esc(m[1]) + "</span>" + esc(m[2])
                                : esc(s.text);
                            return '<div class="sug' + (i === 0 ? " latest" : "") + '">' + inner + "</div>";
                        })
                        .join("");
                }
                const tail = transcript.trim().slice(-180);
                if (tail) { tickerEl.style.display = ""; tickerEl.textContent = "…" + tail; }
                else tickerEl.style.display = "none";
                reportHeight();
            }
            function esc(s) { const d = document.createElement("div"); d.textContent = s; return d.innerHTML; }
            function reportHeight() { window.copilot.resize(Math.ceil(card.getBoundingClientRect().height)); }
            let statusTimer = null;
            const subEl = document.getElementById("sub");
            function status(text) {
                if (statusTimer) { clearTimeout(statusTimer); statusTimer = null; }
                if (text) {
                    subEl.textContent = text;
                    subEl.style.color = "#34d399";
                    statusTimer = setTimeout(() => { subEl.textContent = "live"; subEl.style.color = ""; }, 6000);
                } else {
                    subEl.textContent = "live";
                    subEl.style.color = "";
                }
            }

            // SSE feed
            try {
                const es = new EventSource(base + "/api/ambient/stream");
                es.onmessage = (e) => {
                    let d; try { d = JSON.parse(e.data); } catch { return; }
                    if (d.level === "suggestion") { suggestions.unshift({ ts: d.ts, text: d.text }); suggestions = suggestions.slice(0, 8); status(""); render(); }
                    else if (d.level === "activity") { status(d.text); }
                    else if (d.level === "transcript") { transcript = (transcript + " " + d.text).slice(-4000); render(); }
                    else if (d.level === "event" && typeof d.text === "string" && d.text.indexOf("meeting-end") === 0) { suggestions = []; transcript = ""; render(); }
                };
            } catch (e) {}

            // Seed from current state in case we open mid-meeting
            fetch(base + "/api/state").then((r) => r.json()).then((st) => {
                const a = st.ambient || {};
                if (Array.isArray(a.suggestions) && a.suggestions.length) { suggestions = a.suggestions.slice(); render(); }
                if (a.transcript) { transcript = a.transcript; render(); }
            }).catch(() => {});

            function suggest(q) {
                nowBtn.disabled = true;
                fetch(base + "/api/ambient/suggest", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(q ? { question: q } : {}),
                }).finally(() => { nowBtn.disabled = false; });
            }
            nowBtn.onclick = () => suggest("");
            askEl.onkeydown = (e) => { if (e.key === "Enter" && askEl.value.trim()) { suggest(askEl.value.trim()); askEl.value = ""; } };

            document.getElementById("close").onclick = () => window.copilot.close();
            document.getElementById("min").onclick = () => {
                collapsed = !collapsed;
                body.style.display = collapsed ? "none" : "";
                foot.style.display = collapsed ? "none" : "";
                document.getElementById("min").textContent = collapsed ? "▸" : "▾";
                reportHeight();
            };

            // Drag the whole view by its header (main moves the WebContentsView).
            const head = document.getElementById("head");
            let dragging = false, lastX = 0, lastY = 0;
            head.addEventListener("pointerdown", (e) => {
                if (e.target.closest(".iconbtn")) return;
                dragging = true; lastX = e.screenX; lastY = e.screenY;
                head.setPointerCapture(e.pointerId);
            });
            head.addEventListener("pointermove", (e) => {
                if (!dragging) return;
                const dx = e.screenX - lastX, dy = e.screenY - lastY;
                lastX = e.screenX; lastY = e.screenY;
                if (dx || dy) window.copilot.drag(dx, dy);
            });
            const stop = (e) => { if (dragging) { dragging = false; try { head.releasePointerCapture(e.pointerId); } catch {} } };
            head.addEventListener("pointerup", stop);
            head.addEventListener("pointercancel", stop);

            new ResizeObserver(reportHeight).observe(card);
            render();
        </script>
    </body>
</html>
