<!DOCTYPE html>
<html lang="en" data-theme="dark">
    <head>
        <meta charset="UTF-8" />
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
        />
        <meta name="theme-color" content="#0a0a0c" />
        <meta name="mobile-web-app-capable" content="yes" />
        <meta name="apple-mobile-web-app-capable" content="yes" />
        <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
        <meta name="apple-mobile-web-app-title" content="PiKVM" />
        <link rel="manifest" href="/_agent/manifest.webmanifest" />
        <link rel="apple-touch-icon" href="/_agent/icon.png" />
        <link rel="icon" href="/_agent/icon.png" />
        <link rel="stylesheet" href="/_agent/console.css" />
        <title>PiKVM Console</title>
    </head>
    <body>
        <script>
            try {
                var t = localStorage.getItem("pikvm-console-theme");
                if (!t) t = matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
                document.documentElement.setAttribute("data-theme", t);
            } catch (e) {}
        </script>

        <!-- ── Native desktop titlebar ─────────────────────────────────────────
             Rendered ONLY inside the Electron desktop console window; console.js
             reveals it (and adds `html.desktop-console`) only when the preload's
             `window.desktopConsole` API is present. On phones/browsers this stays
             `display:none` and nothing below it runs, so the web/mobile UI is
             byte-for-byte unchanged. The whole bar is the window drag region; the
             buttons opt out with -webkit-app-region:no-drag (set in CSS). -->
        <div class="titlebar" id="titlebar">
            <div class="tb-left">
                <button class="tb-btn active" id="tb-panel" title="Hide computer preview" aria-label="Hide computer preview" aria-pressed="true">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                        stroke-linejoin="round"><rect x="3" y="4" width="18" height="14" rx="2" /><path d="M8 21h8M12 18v3" /></svg>
                </button>
                <!-- Computer backend readiness (daemon + OmniParser + PiKVM + OCR).
                     Polls the daemon's /status via the proxy; tooltip lists each. -->
                <div class="backend-status" id="backend-status" data-state="unknown" role="status" aria-live="polite" title="Computer backend">
                    <span class="bs-dot" aria-hidden="true"></span>
                    <span class="bs-text" id="bs-text">Backend…</span>
                </div>
            </div>
            <div class="tb-title" id="tb-title">PiKVM</div>
            <div class="tb-right">
                <!-- One indicator for everything wrong with the Pi or the target
                     (no signal, HID detached, undervoltage, throttling, fan). Hidden
                     entirely while there is nothing to say. -->
                <button class="tb-btn tb-health" id="tb-health" title="Health" aria-label="Health" hidden>
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                        stroke-linejoin="round"><path d="M12 3 2 20h20L12 3z" /><path d="M12 10v4M12 17h.01" /></svg>
                </button>
                <!-- ATX power (kvmd api/atx/click). Hidden until the Pi reports that
                     it actually has ATX wiring; the icon colour carries the power LED. -->
                <button class="tb-btn" id="tb-power" title="Power" aria-label="Power control" hidden>
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                        stroke-linejoin="round"><path d="M12 3v9" /><path d="M18.4 6.6a9 9 0 1 1-12.8 0" /></svg>
                </button>
                <!-- Send a keyboard shortcut to the KVM (Ctrl+Alt+Del, Alt+Tab, …). -->
                <button class="tb-btn" id="tb-keys" title="Send keyboard shortcut to the target" aria-label="Send keyboard shortcut">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                        stroke-linejoin="round"><rect x="2" y="6" width="20" height="12" rx="2" /><path d="M6 10h.01M10 10h.01M14 10h.01M18 10h.01M6 14h12" /></svg>
                </button>
                <span class="tb-sep"></span>
                <!-- Audio + mic (WebRTC only) — hidden until a WebRTC session is live. -->
                <button class="tb-btn tb-av" id="tb-audio" title="Audio output" aria-label="Toggle audio output" hidden>
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                        stroke-linejoin="round"><path d="M11 5 6 9H2v6h4l5 4V5z" /><path class="wave" d="M15.5 8.5a5 5 0 0 1 0 7M19 5a9 9 0 0 1 0 14" /></svg>
                </button>
                <button class="tb-btn tb-av" id="tb-mic" title="Microphone" aria-label="Toggle microphone" hidden>
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                        stroke-linejoin="round"><rect x="9" y="2" width="6" height="11" rx="3" /><path d="M5 10a7 7 0 0 0 14 0M12 17v4" /></svg>
                </button>
                <span class="tb-sep tb-av-sep" hidden></span>
                <button class="tb-btn" id="tb-fit" title="Fit to native resolution" aria-label="Fit to native resolution">
                    <span class="tb-ico" style="--icon: url(/_agent/native.svg)"></span>
                </button>
                <!-- Settings (connection / origin) — opens in its own window. -->
                <button class="tb-btn" id="tb-settings" title="Settings" aria-label="Settings">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                        stroke-linejoin="round"><circle cx="12" cy="12" r="3" /><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z" /></svg>
                </button>
                <span class="tb-sep"></span>
                <button class="tb-btn tb-win" id="tb-min" title="Minimise" aria-label="Minimise">
                    <span class="tb-ico" style="--icon: url(/_agent/minimize.svg)"></span>
                </button>
                <button class="tb-btn tb-win" id="tb-max" title="Maximise" aria-label="Maximise">
                    <span class="tb-ico tb-ico-max" style="--icon: url(/_agent/maximize.svg)"></span>
                    <span class="tb-ico tb-ico-restore" style="--icon: url(/_agent/restore.svg)"></span>
                </button>
                <button class="tb-btn tb-win tb-close" id="tb-close" title="Close" aria-label="Close">
                    <span class="tb-ico" style="--icon: url(/_agent/close.svg)"></span>
                </button>
            </div>
        </div>

        <div class="app" id="app">
            <!-- Live screen (top, resizable) -->
            <div class="screen" id="screen-pane">
                <!-- Native MJPEG or capability-selected VNC snapshot picture. -->
                <img id="screen" alt="Remote computer screen" draggable="false" />
                <!-- WebRTC (Janus) H.264 video — occupies the EXACT same box as the
                     <img>; shown when WebRTC is live, hidden (and the <img> shown)
                     when it is unavailable or fails. Muted by default for autoplay;
                     the Audio toggle unmutes the remote audio track. -->
                <video id="screen-video" class="hidden" autoplay playsinline muted></video>

                <!-- Our own cursor (the OS one is hidden over the screen), styled
                     like PiKVM's: a translucent blue dot with a light ring. -->
                <div class="kvm-cursor" id="kvm-cursor"></div>

                <!-- Transient toast over the top of the stream: pops when the stream
                     resolution / source changes, then fades. Also reflects A/M state.
                     pointer-events:none so it never blocks a click on the surface. -->
                <div class="res-toast" id="res-toast">
                    <span id="res-toast-main">—</span>
                    <span class="res-toast-av" id="res-toast-av"></span>
                </div>

                <!-- General-purpose transient message (power actions, errors). Sits at
                     the bottom so it never collides with the resolution toast above. -->
                <div class="toast" id="toast" role="status" aria-live="polite"></div>

                <!-- Health + HID recovery: what is wrong, and the buttons that fix the
                     part of it we can fix from here. -->
                <div class="dlg-scrim" id="health-dlg" hidden>
                    <div class="dlg" role="dialog" aria-modal="true" aria-labelledby="health-dlg-title">
                        <h2 class="dlg-title" id="health-dlg-title">Health</h2>
                        <ul class="dlg-list" id="health-list"></ul>
                        <p class="dlg-note" id="health-ok" hidden>Everything looks fine.</p>
                        <div class="dlg-row">
                            <span class="dlg-label">Keyboard &amp; mouse</span>
                            <span class="dlg-hint" id="health-hid-state"></span>
                        </div>
                        <div class="dlg-actions">
                            <button type="button" class="dlg-btn" id="hid-toggle">Detach</button>
                            <button type="button" class="dlg-btn" id="hid-reset">Reset</button>
                            <button type="button" class="dlg-btn primary" id="health-close">Done</button>
                        </div>
                    </div>
                </div>

                <!-- Stream settings (kvmd api/streamer/set_params). Each row is hidden
                     unless the Pi reports the matching feature, and the ranges come
                     from its own limits rather than being hardcoded here. -->
                <div class="dlg-scrim" id="stream-dlg" hidden>
                    <div class="dlg" role="dialog" aria-modal="true" aria-labelledby="stream-dlg-title">
                        <h2 class="dlg-title" id="stream-dlg-title">Stream</h2>
                        <div class="dlg-row" id="sp-resolution-row" hidden>
                            <label class="dlg-label" for="sp-resolution">Resolution</label>
                            <select id="sp-resolution" class="dlg-select"></select>
                        </div>
                        <div class="dlg-row" id="sp-quality-row" hidden>
                            <label class="dlg-label" for="sp-quality">Quality</label>
                            <input type="range" id="sp-quality" class="dlg-range" min="5" max="100" step="5" />
                            <span class="dlg-hint" id="sp-quality-value"></span>
                        </div>
                        <div class="dlg-row" id="sp-fps-row" hidden>
                            <label class="dlg-label" for="sp-fps">Target FPS</label>
                            <input type="range" id="sp-fps" class="dlg-range" min="0" max="70" step="1" />
                            <span class="dlg-hint" id="sp-fps-value"></span>
                        </div>
                        <div class="dlg-row" id="sp-bitrate-row" hidden>
                            <label class="dlg-label" for="sp-bitrate">H264 bitrate</label>
                            <input type="range" id="sp-bitrate" class="dlg-range" min="25" max="20000" step="25" />
                            <span class="dlg-hint" id="sp-bitrate-value"></span>
                        </div>
                        <div class="dlg-row" id="sp-gop-row" hidden>
                            <label class="dlg-label" for="sp-gop">H264 GOP</label>
                            <input type="range" id="sp-gop" class="dlg-range" min="0" max="60" step="1" />
                            <span class="dlg-hint" id="sp-gop-value"></span>
                        </div>
                        <p class="dlg-note" id="sp-empty" hidden>The Pi has not reported any adjustable stream settings.</p>
                        <div class="dlg-actions">
                            <button type="button" class="dlg-btn" id="sp-screenshot">Save screenshot</button>
                            <button type="button" class="dlg-btn" id="sp-reset">Reset stream</button>
                            <button type="button" class="dlg-btn primary" id="sp-close">Done</button>
                        </div>
                    </div>
                </div>

                <!-- Paste-as-keys (kvmd api/hid/print): the Pi types the whole string
                     using its own keymap, which is layout-correct and far faster than
                     sending it key by key. Prefilled from the host clipboard. -->
                <div class="dlg-scrim" id="paste-dlg" hidden>
                    <div class="dlg" role="dialog" aria-modal="true" aria-labelledby="paste-dlg-title">
                        <h2 class="dlg-title" id="paste-dlg-title">Paste text to the target</h2>
                        <textarea id="paste-text" class="dlg-input" rows="6" spellcheck="false"
                            placeholder="Text to type on the target…"></textarea>
                        <div class="dlg-row">
                            <label class="dlg-label" for="paste-keymap">Keymap</label>
                            <select id="paste-keymap" class="dlg-select"></select>
                            <span class="dlg-hint" id="paste-count"></span>
                        </div>
                        <div class="dlg-actions">
                            <button type="button" class="dlg-btn" id="paste-cancel">Cancel</button>
                            <button type="button" class="dlg-btn primary" id="paste-send">Paste</button>
                        </div>
                    </div>
                </div>

                <div class="overlay" role="status" aria-live="polite">
                    <div class="stream-state">
                        <div class="stream-state-icon" aria-hidden="true">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
                                stroke-linecap="round" stroke-linejoin="round">
                                <rect x="3" y="4" width="18" height="13" rx="2" />
                                <path d="M8 21h8M12 17v4" />
                            </svg>
                        </div>
                        <div class="stream-state-copy">
                            <strong id="overlay-title">Connecting to computer</strong>
                            <span id="overlay-detail">Waiting for the first screen frame.</span>
                        </div>
                        <button id="overlay-retry" class="stream-retry" type="button" hidden>Retry now</button>
                    </div>
                </div>
            </div>

            <!-- One thin control bar. Drag the grip/status to resize (smooth). Just
                 the essentials; everything else lives in the ⋯ menu so it fits. -->
            <div class="bar" id="bar">
                <div class="grip" id="grip" title="Drag to resize"></div>
                <div class="bar-main" id="bar-main">
                    <span class="dot" id="conn" title="Connection"></span>
                    <span class="status" id="conn-text">Connecting…</span>
                    <span class="spacer"></span>
                    <button class="ibtn" id="kbd-btn" title="Keys &amp; mouse" aria-label="Controls">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                            stroke-linejoin="round"><rect x="2" y="6" width="20" height="12" rx="2" /><path
                                d="M6 10h.01M10 10h.01M14 10h.01M18 10h.01M6 14h12" /></svg>
                    </button>
                    <button class="ibtn" id="more-btn" title="More" aria-label="More">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"
                            stroke-linejoin="round"><circle cx="5" cy="12" r="1" /><circle cx="12" cy="12" r="1" /><circle cx="19" cy="12" r="1" /></svg>
                    </button>
                </div>
            </div>

            <!-- Overflow menu (anchored to the ⋯ button). -->
            <div class="more-menu" id="more-menu">
                <!-- WebRTC audio/mic. Hidden until the WebRTC path is live (MJPEG has
                     no audio); off by default. Toggling these never closes the menu. -->
                <button class="more-item toggle" id="audio-btn" hidden>
                    <span>Audio output</span><span class="more-pip" id="audio-pip">Off</span>
                </button>
                <button class="more-item toggle" id="mic-btn" hidden>
                    <span>Microphone</span><span class="more-pip" id="mic-pip">Off</span>
                </button>
                <div class="more-sep" id="av-sep" hidden></div>
                <!-- Paste-as-keys: kvmd types the string with its own keymap. -->
                <button class="more-item" id="paste-btn">Paste text to the target…</button>
                <button class="more-item" id="stream-btn">Stream settings…</button>
                <button class="more-item" id="screenshot-btn">Save screenshot</button>
                <button class="more-item" id="health-btn">Health &amp; keyboard recovery…</button>
                <!-- ATX power. Hidden until the Pi reports it actually has the wiring. -->
                <div class="more-sep" id="atx-sep" hidden></div>
                <button class="more-item" id="atx-power" data-atx="power" hidden>Power button</button>
                <button class="more-item" id="atx-power-long" data-atx="power_long" hidden>Power button (hold 5s)</button>
                <button class="more-item" id="atx-reset" data-atx="reset" hidden>Reset</button>
                <div class="more-sep" id="atx-sep-end" hidden></div>
                <button class="more-item" id="theme-btn">Toggle theme</button>
                <a class="more-item" id="full-ui" href="/?native=1">Full PiKVM UI ⤢</a>
            </div>

            <!-- Chat workspace. The keys/mouse row
                 overlays the TOP of the chat when ⌨ is tapped — never the stream,
                 and no layout reflow. -->
            <div class="chat">
                <!-- Drag the workspace edge to balance chat and computer preview. -->
                <div class="chat-resize" id="chat-resize" title="Resize chat workspace"></div>
                <div class="bar-keys" id="drawer">
                    <button class="ibtn" data-click="left" title="Left click">L</button>
                    <button class="ibtn" data-click="middle" title="Middle click">M</button>
                    <button class="ibtn" data-click="right" title="Right click">R</button>
                    <button class="ibtn" id="drag-lock" title="Hold left (drag)">⤞</button>
                    <span class="sep"></span>
                    <button class="ibtn" data-key="Escape">Esc</button>
                    <button class="ibtn" data-key="Tab">Tab</button>
                    <button class="ibtn" data-mod="ControlLeft">Ctrl</button>
                    <button class="ibtn" data-mod="AltLeft">Alt</button>
                    <button class="ibtn" data-mod="MetaLeft">Win</button>
                    <button class="ibtn" data-key="ArrowLeft">←</button>
                    <button class="ibtn" data-key="ArrowUp">↑</button>
                    <button class="ibtn" data-key="ArrowDown">↓</button>
                    <button class="ibtn" data-key="ArrowRight">→</button>
                    <button class="ibtn" data-key="Backspace">⌫</button>
                    <button class="ibtn" data-key="Enter">⏎</button>
                    <button class="ibtn" data-key="Delete">Del</button>
                    <button class="ibtn" data-key="Home">Home</button>
                    <button class="ibtn" data-key="End">End</button>
                    <button class="ibtn" id="cad" title="Ctrl+Alt+Del">C-A-D</button>
                    <button class="ibtn" data-scroll="up" title="Scroll up">▲</button>
                    <button class="ibtn" data-scroll="down" title="Scroll down">▼</button>
                </div>
                <iframe id="chat-frame" title="Chat workspace"></iframe>
            </div>
        </div>

        <!-- Visually-hidden input that drives the soft keyboard / captures keys. -->
        <input
            class="kbd"
            id="kbd"
            type="text"
            aria-label="Keyboard input to the remote target"
            autocomplete="off"
            autocapitalize="off"
            autocorrect="off"
            spellcheck="false"
        />

        <!-- WebRTC (Janus) wrapper — defines window.JanusStream; console.js consumes
             it and falls back to MJPEG if it is missing or Janus is down. -->
        <script src="/_agent/webrtc.js"></script>
        <!-- Keyboard chord decisions — defines window.KeyChord; console.js consumes it. -->
        <script src="/_agent/key-chord.js"></script>
        <script src="/_agent/console.js"></script>
    </body>
</html>
