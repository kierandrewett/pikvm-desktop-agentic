<!DOCTYPE html>
<html lang="en" data-theme="dark">
    <head>
        <meta charset="UTF-8" />
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
        />
        <meta name="theme-color" content="#0a0a0c" />
        <meta name="mobile-web-app-capable" content="yes" />
        <meta name="apple-mobile-web-app-capable" content="yes" />
        <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
        <meta name="apple-mobile-web-app-title" content="PiKVM" />
        <link rel="manifest" href="/_agent/manifest.webmanifest" />
        <link rel="apple-touch-icon" href="/_agent/icon.png" />
        <link rel="icon" href="/_agent/icon.png" />
        <link rel="stylesheet" href="/_agent/console.css" />
        <title>PiKVM Console</title>
    </head>
    <body>
        <script>
            try {
                var t = localStorage.getItem("pikvm-console-theme");
                if (!t) t = matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
                document.documentElement.setAttribute("data-theme", t);
            } catch (e) {}
        </script>

        <!-- ── Native desktop titlebar ─────────────────────────────────────────
             Rendered ONLY inside the Electron desktop console window; console.js
             reveals it (and adds `html.desktop-console`) only when the preload's
             `window.desktopConsole` API is present. On phones/browsers this stays
             `display:none` and nothing below it runs, so the web/mobile UI is
             byte-for-byte unchanged. The whole bar is the window drag region; the
             buttons opt out with -webkit-app-region:no-drag (set in CSS). -->
        <div class="titlebar" id="titlebar" aria-hidden="true">
            <div class="tb-left">
                <button class="tb-btn" id="tb-panel" title="Toggle agent panel" aria-label="Toggle agent panel">
                    <span class="tb-ico" style="--icon: url(/_agent/agent.svg)"></span>
                </button>
            </div>
            <div class="tb-title" id="tb-title">pikvm · PiKVM Session</div>
            <div class="tb-right">
                <!-- Send a keyboard shortcut to the KVM (Ctrl+Alt+Del, Alt+Tab, …). -->
                <button class="tb-btn" id="tb-keys" title="Send keyboard shortcut to the target" aria-label="Send keyboard shortcut">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                        stroke-linejoin="round"><rect x="2" y="6" width="20" height="12" rx="2" /><path d="M6 10h.01M10 10h.01M14 10h.01M18 10h.01M6 14h12" /></svg>
                </button>
                <span class="tb-sep"></span>
                <!-- Audio + mic (WebRTC only) — hidden until a WebRTC session is live. -->
                <button class="tb-btn tb-av" id="tb-audio" title="Audio output" aria-label="Toggle audio output" hidden>
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                        stroke-linejoin="round"><path d="M11 5 6 9H2v6h4l5 4V5z" /><path class="wave" d="M15.5 8.5a5 5 0 0 1 0 7M19 5a9 9 0 0 1 0 14" /></svg>
                </button>
                <button class="tb-btn tb-av" id="tb-mic" title="Microphone" aria-label="Toggle microphone" hidden>
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                        stroke-linejoin="round"><rect x="9" y="2" width="6" height="11" rx="3" /><path d="M5 10a7 7 0 0 0 14 0M12 17v4" /></svg>
                </button>
                <span class="tb-sep tb-av-sep" hidden></span>
                <button class="tb-btn" id="tb-fit" title="Fit to native resolution" aria-label="Fit to native resolution">
                    <span class="tb-ico" style="--icon: url(/_agent/native.svg)"></span>
                </button>
                <!-- Monitor (ambient) + Settings (models / MCP / secrets / behaviour) — open in their own windows. -->
                <button class="tb-btn" id="tb-monitor" title="Monitor (ambient)" aria-label="Monitor">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                        stroke-linejoin="round"><path d="M22 12h-4l-3 9L9 3l-3 9H2" /></svg>
                </button>
                <button class="tb-btn" id="tb-settings" title="Settings (models, MCP, secrets)" aria-label="Settings">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                        stroke-linejoin="round"><circle cx="12" cy="12" r="3" /><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z" /></svg>
                </button>
                <span class="tb-sep"></span>
                <button class="tb-btn tb-win" id="tb-min" title="Minimise" aria-label="Minimise">
                    <span class="tb-ico" style="--icon: url(/_agent/minimize.svg)"></span>
                </button>
                <button class="tb-btn tb-win" id="tb-max" title="Maximise" aria-label="Maximise">
                    <span class="tb-ico tb-ico-max" style="--icon: url(/_agent/maximize.svg)"></span>
                    <span class="tb-ico tb-ico-restore" style="--icon: url(/_agent/restore.svg)"></span>
                </button>
                <button class="tb-btn tb-win tb-close" id="tb-close" title="Close" aria-label="Close">
                    <span class="tb-ico" style="--icon: url(/_agent/close.svg)"></span>
                </button>
            </div>
        </div>

        <div class="app" id="app">
            <!-- Live screen (top, resizable) -->
            <div class="screen" id="screen-pane">
                <!-- MJPEG fallback picture. -->
                <img id="screen" alt="KVM screen" draggable="false" />
                <!-- WebRTC (Janus) H.264 video — occupies the EXACT same box as the
                     <img>; shown when WebRTC is live, hidden (and the <img> shown)
                     when it is unavailable or fails. Muted by default for autoplay;
                     the Audio toggle unmutes the remote audio track. -->
                <video id="screen-video" class="hidden" autoplay playsinline muted></video>

                <!-- Agent "X-ray": cursor / look / typing boxes drawn over the screen,
                     fed by /_agent/api/overlay/stream. pointer-events:none. -->
                <div class="xray" id="xray">
                    <div class="ai-cursor" id="ai-cursor"></div>
                </div>

                <!-- Our own cursor (the OS one is hidden over the screen), styled
                     like PiKVM's: a translucent blue dot with a light ring. -->
                <div class="kvm-cursor" id="kvm-cursor"></div>

                <!-- Transient toast over the top of the stream: pops when the stream
                     resolution / source changes, then fades. Also reflects A/M state.
                     pointer-events:none so it never blocks a click on the surface. -->
                <div class="res-toast" id="res-toast">
                    <span id="res-toast-main">—</span>
                    <span class="res-toast-av" id="res-toast-av"></span>
                </div>

                <!-- Shown while the agent is driving the target. -->
                <div class="acting-bar" id="acting-bar">
                    <span class="acting-dot"></span>
                    <div class="acting-label">
                        <b>Agent is in control</b>
                        <span id="acting-action">working…</span>
                        <span class="acting-ctx" id="acting-ctx"></span>
                    </div>
                    <button class="ibtn" id="act-pause" title="Pause — take control, then resume">❚❚</button>
                    <button class="ibtn danger" id="act-stop" title="Stop the agent">■ Stop</button>
                </div>

                <!-- Floating meeting copilot, fed by the ambient SSE. -->
                <div class="copilot" id="copilot">
                    <div class="copilot-head">
                        <span class="copilot-dot"></span><span>Copilot</span>
                        <span class="grow"></span>
                        <button class="copilot-x" id="copilot-x" title="Dismiss">✕</button>
                    </div>
                    <div class="copilot-body" id="copilot-body"></div>
                </div>

                <div class="overlay">
                    <div class="spinner" id="overlay-spin"></div>
                    <div id="overlay-msg">Connecting to the stream…</div>
                </div>
            </div>

            <!-- One thin control bar. Drag the grip/status to resize (smooth). Just
                 the essentials; everything else lives in the ⋯ menu so it fits. -->
            <div class="bar" id="bar">
                <div class="grip" id="grip" title="Drag to resize"></div>
                <div class="bar-main" id="bar-main">
                    <span class="dot" id="conn" title="Connection"></span>
                    <span class="status" id="conn-text">Connecting…</span>
                    <span class="agent-status" id="agent-status"></span>
                    <span class="spacer"></span>
                    <button class="ibtn" data-agent="new" title="New chat" aria-label="New chat">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                            stroke-linejoin="round"><path d="M12 5v14M5 12h14" /></svg>
                    </button>
                    <button class="ibtn" id="kbd-btn" title="Keys &amp; mouse" aria-label="Controls">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                            stroke-linejoin="round"><rect x="2" y="6" width="20" height="12" rx="2" /><path
                                d="M6 10h.01M10 10h.01M14 10h.01M18 10h.01M6 14h12" /></svg>
                    </button>
                    <button class="ibtn" id="more-btn" title="More" aria-label="More">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"
                            stroke-linejoin="round"><circle cx="5" cy="12" r="1" /><circle cx="12" cy="12" r="1" /><circle cx="19" cy="12" r="1" /></svg>
                    </button>
                </div>
            </div>

            <!-- Overflow menu (anchored to the ⋯ button). -->
            <div class="more-menu" id="more-menu">
                <button class="more-item" data-agent="history">History</button>
                <button class="more-item" data-agent="ambient">Monitor</button>
                <button class="more-item" data-agent="settings">Settings</button>
                <button class="more-item" data-agent="copy">Copy conversation</button>
                <div class="more-sep"></div>
                <!-- WebRTC audio/mic. Hidden until the WebRTC path is live (MJPEG has
                     no audio); off by default. Toggling these never closes the menu. -->
                <button class="more-item toggle" id="audio-btn" hidden>
                    <span>Audio output</span><span class="more-pip" id="audio-pip">Off</span>
                </button>
                <button class="more-item toggle" id="mic-btn" hidden>
                    <span>Microphone</span><span class="more-pip" id="mic-pip">Off</span>
                </button>
                <div class="more-sep" id="av-sep" hidden></div>
                <button class="more-item" id="theme-btn">Toggle theme</button>
                <a class="more-item" id="full-ui" href="/?native=1">Full PiKVM UI ⤢</a>
            </div>

            <!-- Agent chat (reuses the existing sidebar app). The keys/mouse row
                 overlays the TOP of the chat when ⌨ is tapped — never the stream,
                 and no layout reflow. -->
            <div class="chat">
                <!-- Drag the agent panel's left edge to resize it (desktop only). -->
                <div class="chat-resize" id="chat-resize" title="Drag to resize the agent panel"></div>
                <div class="bar-keys" id="drawer">
                    <button class="ibtn" data-click="left" title="Left click">L</button>
                    <button class="ibtn" data-click="middle" title="Middle click">M</button>
                    <button class="ibtn" data-click="right" title="Right click">R</button>
                    <button class="ibtn" id="drag-lock" title="Hold left (drag)">⤞</button>
                    <span class="sep"></span>
                    <button class="ibtn" data-key="Escape">Esc</button>
                    <button class="ibtn" data-key="Tab">Tab</button>
                    <button class="ibtn" data-mod="ControlLeft">Ctrl</button>
                    <button class="ibtn" data-mod="AltLeft">Alt</button>
                    <button class="ibtn" data-mod="MetaLeft">Win</button>
                    <button class="ibtn" data-key="ArrowLeft">←</button>
                    <button class="ibtn" data-key="ArrowUp">↑</button>
                    <button class="ibtn" data-key="ArrowDown">↓</button>
                    <button class="ibtn" data-key="ArrowRight">→</button>
                    <button class="ibtn" data-key="Backspace">⌫</button>
                    <button class="ibtn" data-key="Enter">⏎</button>
                    <button class="ibtn" data-key="Delete">Del</button>
                    <button class="ibtn" data-key="Home">Home</button>
                    <button class="ibtn" data-key="End">End</button>
                    <button class="ibtn" id="cad" title="Ctrl+Alt+Del">C-A-D</button>
                    <button class="ibtn" data-scroll="up" title="Scroll up">▲</button>
                    <button class="ibtn" data-scroll="down" title="Scroll down">▼</button>
                </div>
                <iframe id="chat-frame" title="Agent"></iframe>
            </div>
        </div>

        <!-- Visually-hidden input that drives the soft keyboard / captures keys. -->
        <input
            class="kbd"
            id="kbd"
            type="text"
            aria-label="Keyboard input to the remote target"
            autocomplete="off"
            autocapitalize="off"
            autocorrect="off"
            spellcheck="false"
        />

        <!-- WebRTC (Janus) wrapper — defines window.JanusStream; console.js consumes
             it and falls back to MJPEG if it is missing or Janus is down. -->
        <script src="/_agent/webrtc.js"></script>
        <script src="/_agent/console.js"></script>
    </body>
</html>
