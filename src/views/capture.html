<!DOCTYPE html>
<!--
  Hidden capture surface for the desktop's web mode. It renders ONLY the live
  MJPEG stream (no chrome) so the main process can capturePage() it cheaply for
  the ambient monitor's change fingerprint and watched-typing's pixel grid — both
  differential, so the object-fit letterbox bars (constant) don't matter. The
  agent's actual vision screenshots use the exact Pi snapshot endpoint instead.
  Loaded behind the console view; never shown to the user.
-->
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <style>
            html,
            body {
                margin: 0;
                height: 100%;
                background: #000;
                overflow: hidden;
            }
            img {
                width: 100%;
                height: 100%;
                object-fit: contain;
                display: block;
            }
        </style>
    </head>
    <body>
        <img id="s" alt="" />
        <script>
            var key = Math.random().toString(16).slice(2) + Date.now().toString(16);
            var img = document.getElementById("s");
            function load() {
                img.src = "/streamer/stream?key=" + encodeURIComponent(key) + "&advance_headers=1&t=" + Date.now();
            }
            img.onerror = function () {
                setTimeout(load, 1500);
            };
            load();
        </script>
    </body>
</html>
