<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>PiKVM Desktop — Settings</title>
    <style>
        /* Named, so this window can follow the console's theme. It used to be a
           set of literal hex values with color-scheme:dark pinned on, which
           made Settings a black window over a light console — the one part of
           the app that ignored the choice. Main remembers the theme the console
           last reported and the preload hands it over before the first paint. */
        :root {
            color-scheme: dark;
            --s-bg: #0a0a0c;
            --s-fg: #e6e6ea;
            --s-title: #f2f2f6;
            --s-muted: #9a9aa6;
            --s-hint: #8a8a95;
            --s-field: #131318;
            --s-border: #2a2a32;
            --s-btn: #1b1b22;
            --s-btn-hover: #24242c;
            --s-accent: #4c6ef5;
            --s-primary: #4361d7;
            --s-primary-hover: #506cda;
            --s-danger: #f2827c;
        }
        :root[data-theme="light"] {
            color-scheme: light;
            --s-bg: #eef0f4;
            --s-fg: #17171c;
            --s-title: #0f0f14;
            /* Both cleared 4.5:1 on their own backgrounds; the dark theme's
               greys are far too pale on a light one. */
            --s-muted: #5b5b66;
            --s-hint: #5b5b66;
            --s-field: #ffffff;
            --s-border: #d3d4dc;
            --s-btn: #ffffff;
            --s-btn-hover: #e9eaf0;
            --s-accent: #3b6ef0;
            --s-primary: #3355cc;
            --s-primary-hover: #2c4bbb;
            --s-danger: #c0322c;
        }
        * { box-sizing: border-box; }
        /* min-height, not height, on the body.
           Main sizes this window by reading documentElement.scrollHeight once
           after load. Pinned to height:100% the body cannot grow past the
           viewport, so content that needs more simply overflows THROUGH the
           bottom padding — and the measurement comes back one padding short.
           The window then opened with Save and Cancel flush against its bottom
           edge, touching the frame. Letting the body grow makes the number it
           reports the number it actually needs. */
        html { margin: 0; height: 100%; }
        body { margin: 0; min-height: 100%; }
        body {
            background: var(--s-bg);
            color: var(--s-fg);
            font: 13px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
            padding: 18px 20px;
            -webkit-user-select: none;
            user-select: none;
        }
        h1 { font-size: 14px; font-weight: 600; margin: 0 0 14px; color: var(--s-title); }
        label { display: block; font-size: 11px; text-transform: uppercase; letter-spacing: .04em; color: var(--s-muted); margin: 14px 0 5px; }
        input[type="text"], select {
            width: 100%; padding: 8px 9px; border-radius: 7px;
            border: 1px solid var(--s-border); background: var(--s-field); color: var(--s-fg);
            font: inherit; outline: none;
        }
        input[type="text"]:focus, select:focus { border-color: var(--s-accent); }
        input[type="text"]:disabled { opacity: .5; }
        /* The UA default for a dark colour-scheme lands at 3.97:1 here;
           placeholder text needs the same 4.5:1 as any other text. */
        input[type="text"]::placeholder { color: var(--s-hint); }
        .hint { font-size: 11px; color: var(--s-hint); margin-top: 5px; }
        /* Always present, so revealing a problem does not change the height of a
           window that is measured once at load and cannot be resized. */
        .err { font-size: 11px; color: var(--s-danger); margin: 4px 0 0; min-height: 15px; }
        input[type="text"][aria-invalid="true"] { border-color: var(--s-danger); }
        .row { display: flex; align-items: center; gap: 8px; margin-top: 14px; }
        .row input[type="checkbox"] { width: 15px; height: 15px; accent-color: var(--s-accent); }
        .row label { margin: 0; text-transform: none; letter-spacing: 0; font-size: 13px; color: var(--s-fg); }
        .actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 22px; }
        button {
            padding: 8px 16px; border-radius: 7px; border: 1px solid var(--s-border);
            background: var(--s-btn); color: var(--s-fg); font: inherit; cursor: pointer;
        }
        button:hover { background: var(--s-btn-hover); }
        button.primary { background: var(--s-primary); border-color: var(--s-primary); color: #fff; }
        button.primary:hover { background: var(--s-primary-hover); }
        .note { font-size: 11px; color: var(--s-hint); margin-top: 14px; }
    </style>
</head>
<body>
    <h1>Settings</h1>

    <label for="pikvm-url">PiKVM connection</label>
    <!-- Described by its hint AND its error, so both are read with the field
         rather than being loose text that happens to sit near it. -->
    <input id="pikvm-url" type="text" placeholder="https://user:password@pikvm/" autocomplete="off" spellcheck="false"
        aria-describedby="url-hint url-err" />
    <div class="hint" id="url-hint">The PiKVM URL the app connects to. Credentials may be included in the URL; the password stays hidden until you click into the field.</div>
    <!-- alert, not status: this line only ever holds a problem, and it appears
         because the user just pressed Save and it did not happen. A polite
         region waits for a gap in speech, which for a failed action means the
         user can be typing again before they hear why nothing worked. The
         console's toast made the same call for the same reason. -->
    <p class="err" id="url-err" role="alert" aria-live="assertive"></p>

    <label for="layout">Keyboard layout</label>
    <select id="layout">
        <option value="us">US (QWERTY)</option>
        <option value="uk">UK (QWERTY)</option>
    </select>

    <div class="row">
        <input id="jiggler" type="checkbox" />
        <label for="jiggler">Idle mouse jiggler (nudge the cursor to keep the target awake)</label>
    </div>

    <div class="note">Saving relaunches the app so the connection and layout take effect.</div>

    <div class="actions">
        <button id="cancel" type="button">Cancel</button>
        <button id="save" type="button" class="primary">Save &amp; restart</button>
    </div>

    <script>
        (function () {
            var S = window.pikvmSettings;

            /* Theme first, before anything reads a colour.
               Read synchronously from the preload so the window paints in the
               right theme on its FIRST frame — asking after load would flash
               the wrong one in a window that is only on screen for a moment. */
            function applyTheme(t) {
                document.documentElement.setAttribute("data-theme", t === "light" ? "light" : "dark");
            }
            try {
                applyTheme(S && S.theme ? S.theme() : "dark");
            } catch (e) {
                applyTheme("dark");
            }
            // And follow the console if it is toggled while this window is open.
            try {
                if (S && S.onTheme) S.onTheme(applyTheme);
            } catch (e) {}

            var urlEl = document.getElementById("pikvm-url");
            var layoutEl = document.getElementById("layout");
            var jigglerEl = document.getElementById("jiggler");
            var saveEl = document.getElementById("save");
            var cancelEl = document.getElementById("cancel");

            var data = (S && S.read()) || { pikvmUrl: "", keyboardLayout: "us", jiggler: true, originLocked: false };
            layoutEl.value = data.keyboardLayout === "uk" ? "uk" : "us";
            jigglerEl.checked = !!data.jiggler;

            /* A URL nothing will read is not a setting.
               When the console is served from somewhere else this desktop is a
               thin client: the remote server owns the connection, the capture
               and the HID, and the local origin is read by nobody. Main has
               always sent a flag for this and this page never looked at it, so
               the field stayed editable — and saving it relaunches the app to
               apply a value that changes nothing. Disabled and told why, which
               is what the :disabled rule above was already written for. The
               layout and the jiggler are still this app's own, so they stay. */
            if (data.originLocked) {
                urlEl.disabled = true;
                document.getElementById("url-hint").textContent =
                    "This desktop is pointed at a remote console, which owns the PiKVM connection. The URL is set there, not here.";
            }

            var errEl = document.getElementById("url-err");

            /* The URL usually carries the PiKVM password inline, and this window
               opens over whatever is on screen. The field therefore shows a
               masked rendering while it is not being edited, and the real text
               only while it has focus.

               `realUrl` — not the input's value — is the source of truth: the
               input can be showing dots, and saving those would write them into
               the config as the password. */
            var realUrl = data.pikvmUrl || "";
            /* scheme://[user][:password]@ — matched on the raw text rather than
               via URL() so masking never reformats what the user typed. */
            var PASSWORD_IN_URL = /^([a-z][a-z0-9+.\-]*:\/\/[^/?#@]*?:)([^@/?#]*)@/i;
            // A fixed run of dots, so the real length is not on show either.
            var MASK = "\u2022\u2022\u2022\u2022\u2022\u2022\u2022\u2022";
            function maskPassword(value) {
                return value.replace(PASSWORD_IN_URL, function (whole, prefix, password) {
                    return password ? prefix + MASK + "@" : whole;
                });
            }
            /* Reveal on anything that can PRECEDE an edit, not on focus alone.
               Chromium sets activeElement without firing focus when the window
               itself is unfocused, which would leave the field editable while
               still showing dots \u2014 and the first keystroke would then store the
               mask as the password. keydown fires before input, so revealing
               here means the input handler always sees real text. */
            function reveal() {
                if (urlEl.value !== realUrl) urlEl.value = realUrl;
            }
            urlEl.value = maskPassword(realUrl);
            urlEl.addEventListener("focus", reveal);
            urlEl.addEventListener("pointerdown", reveal);
            urlEl.addEventListener("keydown", reveal);
            function hide() {
                urlEl.value = maskPassword(realUrl);
            }
            urlEl.addEventListener("blur", hide);
            /* Switching away is exactly when the password should not be sitting
               on screen, and the window can keep the field focused while it is
               in the background. */
            window.addEventListener("blur", hide);

            /* Saving relaunches the app, so a typo here is only discovered when
               the console comes back unable to connect. Empty is allowed and
               means the built-in default. */
            function urlProblem(value) {
                if (!value) return "";
                var parsed;
                try {
                    parsed = new URL(value);
                } catch (e) {
                    return "That is not a URL. Include the scheme, for example https://pikvm/";
                }
                if (parsed.protocol !== "http:" && parsed.protocol !== "https:") {
                    return "The URL must start with http:// or https://";
                }
                if (!parsed.hostname) return "The URL needs a host, for example https://pikvm/";
                return "";
            }
            function attemptSave() {
                if (!S) return;
                var value = realUrl.trim();
                var problem = urlProblem(value);
                errEl.textContent = problem;
                urlEl.setAttribute("aria-invalid", problem ? "true" : "false");
                if (problem) {
                    urlEl.focus();
                    return;
                }
                S.save({
                    pikvmUrl: value,
                    keyboardLayout: layoutEl.value === "uk" ? "uk" : "us",
                    jiggler: jigglerEl.checked,
                });
            }
            saveEl.addEventListener("click", attemptSave);
            cancelEl.addEventListener("click", function () { if (S) S.cancel(); });
            urlEl.addEventListener("input", function () {
                /* Backstop: never store the mask itself as the password. If an
                   edit somehow arrives while the dots are still showing, drop it
                   and reveal instead of corrupting the saved credentials. */
                if (urlEl.value.indexOf(MASK) !== -1) {
                    urlEl.value = realUrl;
                    return;
                }
                realUrl = urlEl.value;
                // Clear the complaint as soon as the field is being corrected.
                if (!errEl.textContent) return;
                errEl.textContent = "";
                urlEl.setAttribute("aria-invalid", "false");
            });
            /* Enter saves only from the URL field. It used to be bound on the
               document, so Enter anywhere — including choosing a keyboard layout
               in the select — saved and relaunched the app. */
            urlEl.addEventListener("keydown", function (e) {
                if (e.key === "Enter") attemptSave();
            });
            document.addEventListener("keydown", function (e) {
                if (e.key === "Escape") cancelEl.click();
            });
            /* The URL field is deliberately NOT focused on open: focus reveals the
               password, and autofocusing would put it on screen every time the
               window appeared. It is still the first thing Tab reaches. */
        })();
    </script>
</body>
</html>
