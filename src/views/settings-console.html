<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>PiKVM Desktop — Settings</title>
    <style>
        :root { color-scheme: dark; }
        * { box-sizing: border-box; }
        html, body { margin: 0; height: 100%; }
        body {
            background: #0a0a0c;
            color: #e6e6ea;
            font: 13px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
            padding: 18px 20px;
            -webkit-user-select: none;
            user-select: none;
        }
        h1 { font-size: 14px; font-weight: 600; margin: 0 0 14px; color: #f2f2f6; }
        label { display: block; font-size: 11px; text-transform: uppercase; letter-spacing: .04em; color: #9a9aa6; margin: 14px 0 5px; }
        input[type="text"], select {
            width: 100%; padding: 8px 9px; border-radius: 7px;
            border: 1px solid #2a2a32; background: #131318; color: #e6e6ea;
            font: inherit; outline: none;
        }
        input[type="text"]:focus, select:focus { border-color: #4c6ef5; }
        input[type="text"]:disabled { opacity: .5; }
        .hint { font-size: 11px; color: #6e6e7a; margin-top: 5px; }
        /* Always present, so revealing a problem does not change the height of a
           window that is measured once at load and cannot be resized. */
        .err { font-size: 11px; color: #f2827c; margin: 4px 0 0; min-height: 15px; }
        input[type="text"][aria-invalid="true"] { border-color: #f2827c; }
        .row { display: flex; align-items: center; gap: 8px; margin-top: 14px; }
        .row input[type="checkbox"] { width: 15px; height: 15px; accent-color: #4c6ef5; }
        .row label { margin: 0; text-transform: none; letter-spacing: 0; font-size: 13px; color: #e6e6ea; }
        .actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 22px; }
        button {
            padding: 8px 16px; border-radius: 7px; border: 1px solid #2a2a32;
            background: #1b1b22; color: #e6e6ea; font: inherit; cursor: pointer;
        }
        button:hover { background: #24242c; }
        button.primary { background: #4c6ef5; border-color: #4c6ef5; color: #fff; }
        button.primary:hover { background: #5b7bf7; }
        .note { font-size: 11px; color: #6e6e7a; margin-top: 14px; }
    </style>
</head>
<body>
    <h1>Settings</h1>

    <label for="pikvm-url">PiKVM connection</label>
    <input id="pikvm-url" type="text" placeholder="https://user:password@pikvm/" autocomplete="off" spellcheck="false" />
    <div class="hint">The PiKVM URL the app connects to. Credentials may be included in the URL; the password stays hidden until you click into the field.</div>
    <p class="err" id="url-err" role="status" aria-live="polite"></p>

    <label for="layout">Keyboard layout</label>
    <select id="layout">
        <option value="us">US (QWERTY)</option>
        <option value="uk">UK (QWERTY)</option>
    </select>

    <div class="row">
        <input id="jiggler" type="checkbox" />
        <label for="jiggler">Idle mouse jiggler (nudge the cursor to keep the target awake)</label>
    </div>

    <div class="note">Saving relaunches the app so the connection and layout take effect.</div>

    <div class="actions">
        <button id="cancel" type="button">Cancel</button>
        <button id="save" type="button" class="primary">Save &amp; restart</button>
    </div>

    <script>
        (function () {
            var S = window.pikvmSettings;
            var urlEl = document.getElementById("pikvm-url");
            var layoutEl = document.getElementById("layout");
            var jigglerEl = document.getElementById("jiggler");
            var saveEl = document.getElementById("save");
            var cancelEl = document.getElementById("cancel");

            var data = (S && S.read()) || { pikvmUrl: "", keyboardLayout: "us", jiggler: true, envLocked: false };
            layoutEl.value = data.keyboardLayout === "uk" ? "uk" : "us";
            jigglerEl.checked = !!data.jiggler;

            var errEl = document.getElementById("url-err");

            /* The URL usually carries the PiKVM password inline, and this window
               opens over whatever is on screen. The field therefore shows a
               masked rendering while it is not being edited, and the real text
               only while it has focus.

               `realUrl` — not the input's value — is the source of truth: the
               input can be showing dots, and saving those would write them into
               the config as the password. */
            var realUrl = data.pikvmUrl || "";
            /* scheme://[user][:password]@ — matched on the raw text rather than
               via URL() so masking never reformats what the user typed. */
            var PASSWORD_IN_URL = /^([a-z][a-z0-9+.\-]*:\/\/[^/?#@]*?:)([^@/?#]*)@/i;
            // A fixed run of dots, so the real length is not on show either.
            var MASK = "\u2022\u2022\u2022\u2022\u2022\u2022\u2022\u2022";
            function maskPassword(value) {
                return value.replace(PASSWORD_IN_URL, function (whole, prefix, password) {
                    return password ? prefix + MASK + "@" : whole;
                });
            }
            /* Reveal on anything that can PRECEDE an edit, not on focus alone.
               Chromium sets activeElement without firing focus when the window
               itself is unfocused, which would leave the field editable while
               still showing dots \u2014 and the first keystroke would then store the
               mask as the password. keydown fires before input, so revealing
               here means the input handler always sees real text. */
            function reveal() {
                if (urlEl.value !== realUrl) urlEl.value = realUrl;
            }
            urlEl.value = maskPassword(realUrl);
            urlEl.addEventListener("focus", reveal);
            urlEl.addEventListener("pointerdown", reveal);
            urlEl.addEventListener("keydown", reveal);
            function hide() {
                urlEl.value = maskPassword(realUrl);
            }
            urlEl.addEventListener("blur", hide);
            /* Switching away is exactly when the password should not be sitting
               on screen, and the window can keep the field focused while it is
               in the background. */
            window.addEventListener("blur", hide);

            /* Saving relaunches the app, so a typo here is only discovered when
               the console comes back unable to connect. Empty is allowed and
               means the built-in default. */
            function urlProblem(value) {
                if (!value) return "";
                var parsed;
                try {
                    parsed = new URL(value);
                } catch (e) {
                    return "That is not a URL. Include the scheme, for example https://pikvm/";
                }
                if (parsed.protocol !== "http:" && parsed.protocol !== "https:") {
                    return "The URL must start with http:// or https://";
                }
                if (!parsed.hostname) return "The URL needs a host, for example https://pikvm/";
                return "";
            }
            function attemptSave() {
                if (!S) return;
                var value = realUrl.trim();
                var problem = urlProblem(value);
                errEl.textContent = problem;
                urlEl.setAttribute("aria-invalid", problem ? "true" : "false");
                if (problem) {
                    urlEl.focus();
                    return;
                }
                S.save({
                    pikvmUrl: value,
                    keyboardLayout: layoutEl.value === "uk" ? "uk" : "us",
                    jiggler: jigglerEl.checked,
                });
            }
            saveEl.addEventListener("click", attemptSave);
            cancelEl.addEventListener("click", function () { if (S) S.cancel(); });
            urlEl.addEventListener("input", function () {
                /* Backstop: never store the mask itself as the password. If an
                   edit somehow arrives while the dots are still showing, drop it
                   and reveal instead of corrupting the saved credentials. */
                if (urlEl.value.indexOf(MASK) !== -1) {
                    urlEl.value = realUrl;
                    return;
                }
                realUrl = urlEl.value;
                // Clear the complaint as soon as the field is being corrected.
                if (!errEl.textContent) return;
                errEl.textContent = "";
                urlEl.setAttribute("aria-invalid", "false");
            });
            /* Enter saves only from the URL field. It used to be bound on the
               document, so Enter anywhere — including choosing a keyboard layout
               in the select — saved and relaunched the app. */
            urlEl.addEventListener("keydown", function (e) {
                if (e.key === "Enter") attemptSave();
            });
            document.addEventListener("keydown", function (e) {
                if (e.key === "Escape") cancelEl.click();
            });
            /* The URL field is deliberately NOT focused on open: focus reveals the
               password, and autofocusing would put it on screen every time the
               window appeared. It is still the first thing Tab reaches. */
        })();
    </script>
</body>
</html>
