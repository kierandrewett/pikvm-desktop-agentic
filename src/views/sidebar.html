<!DOCTYPE html>
<html lang="en" data-theme="dark">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Agent</title>
        <link rel="stylesheet" href="sidebar.css" />
    </head>
    <body>
        <div id="root"></div>
        <script>
            // Theme sources, in order: desktop window state (Electron), the
            // ?theme= URL param and postMessage from the web console host.
            function applyTheme(t) {
                if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
            }
            try {
                window.ui?.onState?.((s) => applyTheme(s.theme || "dark"));
            } catch (e) {}
            try {
                applyTheme(new URLSearchParams(location.search).get("theme"));
            } catch (e) {}
            window.addEventListener("message", (e) => {
                if (e.data && e.data.type === "pikvm-theme") applyTheme(e.data.theme);
            });
        </script>
        <script src="sidebar.js"></script>
    </body>
</html>
