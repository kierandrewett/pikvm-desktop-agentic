<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Agent</title>
        <style>
            :root {
                --bg: #0f0f14;
                --panel: #16161d;
                --line: #26262f;
                --text: #e7e7ee;
                --muted: #9a9aa8;
                --accent: #6c8cff;
                --danger: #ff5d5d;
                --ok: #3ecf8e;
            }
            body[data-theme="light"] {
                --bg: #f5f5f7;
                --panel: #ffffff;
                --line: #e2e2e8;
                --text: #17171c;
                --muted: #6a6a76;
            }
            * {
                box-sizing: border-box;
            }
            html,
            body {
                margin: 0;
                height: 100%;
                background: var(--bg);
                color: var(--text);
                font: 13px/1.45 system-ui, -apple-system, sans-serif;
            }
            .app {
                display: flex;
                flex-direction: column;
                height: 100vh;
                position: relative;
            }
            .hd {
                padding: 8px 10px;
                border-bottom: 1px solid var(--line);
                background: var(--panel);
            }
            .hd .row {
                display: flex;
                align-items: center;
                justify-content: space-between;
            }
            .hd .title {
                font-weight: 600;
            }
            .policy {
                background: var(--bg);
                color: var(--text);
                border: 1px solid var(--line);
                border-radius: 6px;
                padding: 3px 6px;
                font-size: 12px;
            }
            .signin {
                margin-top: 8px;
                width: 100%;
                padding: 7px;
                background: var(--accent);
                color: #fff;
                border: 0;
                border-radius: 7px;
                cursor: pointer;
                font-weight: 600;
            }
            .banner {
                margin-top: 8px;
                padding: 6px 8px;
                border-radius: 6px;
                font-size: 12px;
            }
            .banner.paused {
                background: color-mix(in srgb, var(--danger) 20%, transparent);
            }
            .banner.goal {
                background: color-mix(in srgb, var(--accent) 18%, transparent);
            }
            .log {
                flex: 1;
                overflow-y: auto;
                padding: 10px;
                display: flex;
                flex-direction: column;
                gap: 10px;
            }
            .msg {
                display: flex;
                flex-direction: column;
                gap: 6px;
            }
            .msg.user p {
                align-self: flex-end;
                background: var(--accent);
                color: #fff;
                padding: 6px 10px;
                border-radius: 10px;
                margin: 0;
                max-width: 85%;
            }
            .msg.assistant p {
                margin: 0;
                white-space: pre-wrap;
            }
            .shot {
                position: relative;
            }
            .shot img {
                width: 100%;
                border-radius: 8px;
                border: 1px solid var(--line);
                display: block;
            }
            .shot .marker {
                position: absolute;
                width: 16px;
                height: 16px;
                margin: -8px 0 0 -8px;
                border-radius: 50%;
                pointer-events: none;
            }
            .shot .marker.click,
            .shot .marker.double_click {
                border: 2px solid #ff4d4d;
                box-shadow: 0 0 0 2px rgba(255, 77, 77, 0.35);
                animation: ripple 1.2s ease-out 2;
            }
            .shot .marker.move {
                width: 10px;
                height: 10px;
                margin: -5px 0 0 -5px;
                border: 2px solid #6c8cff;
                background: rgba(108, 140, 255, 0.25);
            }
            @keyframes ripple {
                0% {
                    transform: scale(0.5);
                    opacity: 1;
                }
                100% {
                    transform: scale(1.6);
                    opacity: 0.4;
                }
            }
            .shot .dim {
                position: absolute;
                bottom: 6px;
                right: 6px;
                background: rgba(0, 0, 0, 0.6);
                color: #fff;
                font-size: 11px;
                padding: 1px 6px;
                border-radius: 5px;
            }
            .tool {
                display: inline-flex;
                gap: 6px;
                align-items: center;
                background: var(--panel);
                border: 1px solid var(--line);
                border-radius: 6px;
                padding: 3px 8px;
                font-size: 12px;
                align-self: flex-start;
            }
            .tool .tname {
                font-weight: 600;
                color: var(--accent);
            }
            .tool .tsum {
                color: var(--muted);
            }
            .status {
                font-size: 12px;
                color: var(--muted);
                font-style: italic;
            }
            .status.presence {
                color: var(--danger);
                font-style: normal;
            }
            .auth {
                border: 1px solid var(--accent);
                border-radius: 9px;
                padding: 10px;
                background: var(--panel);
            }
            .ahdr {
                font-weight: 600;
                display: flex;
                gap: 8px;
                align-items: center;
                justify-content: space-between;
            }
            .ahdr code,
            .aargs {
                background: var(--bg);
                border: 1px solid var(--line);
                border-radius: 5px;
                padding: 1px 5px;
                font-size: 11px;
            }
            .areason {
                color: var(--danger);
                font-size: 12px;
                margin: 6px 0;
            }
            .aargs {
                display: block;
                margin: 6px 0;
                white-space: pre-wrap;
                word-break: break-all;
                max-height: 80px;
                overflow: auto;
            }
            .arow {
                display: flex;
                gap: 6px;
            }
            .arow button {
                flex: 1;
                padding: 6px;
                border: 0;
                border-radius: 6px;
                cursor: pointer;
                font-weight: 600;
            }
            .allow {
                background: var(--ok);
                color: #06281c;
            }
            .deny {
                background: var(--danger);
                color: #fff;
            }
            .diff {
                background: var(--line);
                color: var(--text);
            }
            .aredir textarea {
                width: 100%;
                min-height: 54px;
                margin-bottom: 6px;
                background: var(--bg);
                color: var(--text);
                border: 1px solid var(--line);
                border-radius: 6px;
                padding: 6px;
                resize: vertical;
            }
            .remember {
                display: flex;
                gap: 6px;
                align-items: center;
                font-size: 11px;
                color: var(--muted);
                margin-top: 8px;
            }
            /* header groups */
            .hgrp {
                display: flex;
                align-items: center;
                gap: 5px;
            }
            .picker {
                background: var(--bg);
                color: var(--text);
                border: 1px solid var(--line);
                border-radius: 6px;
                padding: 3px 5px;
                font-size: 11px;
                max-width: 96px;
            }
            .sessions {
                position: relative;
                display: flex;
                gap: 2px;
            }
            .iconbtn {
                background: var(--bg);
                color: var(--text);
                border: 1px solid var(--line);
                border-radius: 6px;
                width: 26px;
                height: 24px;
                cursor: pointer;
                font-size: 13px;
                line-height: 1;
            }
            .iconbtn:hover {
                border-color: var(--accent);
            }
            .sesslist {
                position: absolute;
                top: 28px;
                right: 0;
                width: 240px;
                max-height: 320px;
                overflow: auto;
                background: var(--panel);
                border: 1px solid var(--line);
                border-radius: 8px;
                box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
                z-index: 20;
            }
            .sessempty {
                padding: 12px;
                color: var(--muted);
                font-size: 12px;
            }
            .sessrow {
                display: flex;
                align-items: center;
                justify-content: space-between;
                padding: 6px 8px;
                border-bottom: 1px solid var(--line);
            }
            .sessrow.cur {
                background: color-mix(in srgb, var(--accent) 14%, transparent);
            }
            .sesstitle {
                flex: 1;
                cursor: pointer;
                overflow: hidden;
                text-overflow: ellipsis;
                white-space: nowrap;
                font-size: 12px;
            }
            .sessdel {
                background: none;
                border: 0;
                color: var(--muted);
                cursor: pointer;
            }
            .banner.paused {
                display: flex;
                align-items: center;
                justify-content: space-between;
                gap: 8px;
            }
            .banner.paused button {
                background: var(--accent);
                color: #fff;
                border: 0;
                border-radius: 6px;
                padding: 3px 8px;
                cursor: pointer;
                font-size: 11px;
            }
            /* welcome */
            .welcome {
                margin: auto;
                text-align: center;
                color: var(--muted);
                padding: 24px 8px;
            }
            .welcome .wmark {
                font-size: 34px;
                color: var(--accent);
            }
            .welcome h2 {
                color: var(--text);
                margin: 8px 0 4px;
                font-size: 17px;
            }
            .chips {
                display: flex;
                flex-direction: column;
                gap: 6px;
                margin: 12px 0;
            }
            .chip {
                background: var(--panel);
                border: 1px solid var(--line);
                color: var(--text);
                border-radius: 8px;
                padding: 8px 10px;
                cursor: pointer;
                font-size: 12px;
                text-align: left;
            }
            .chip:hover {
                border-color: var(--accent);
            }
            .welcome .hint {
                font-size: 11px;
            }
            /* messages */
            .msg {
                display: flex;
                gap: 8px;
            }
            .msg.user {
                justify-content: flex-end;
            }
            .msg .avatar {
                width: 24px;
                height: 24px;
                flex: 0 0 24px;
                border-radius: 6px;
                background: color-mix(in srgb, var(--accent) 22%, transparent);
                color: var(--accent);
                display: flex;
                align-items: center;
                justify-content: center;
                font-size: 13px;
            }
            .msg .bubble {
                min-width: 0;
                display: flex;
                flex-direction: column;
                gap: 6px;
            }
            .msg.user .bubble {
                align-items: flex-end;
            }
            .msg.user .bubble > span {
                background: var(--accent);
                color: #fff;
                padding: 7px 11px;
                border-radius: 12px 12px 3px 12px;
                max-width: 100%;
                white-space: pre-wrap;
                word-break: break-word;
            }
            .md {
                white-space: normal;
            }
            .md p {
                margin: 4px 0;
            }
            .md h3,
            .md h4,
            .md h5 {
                margin: 8px 0 4px;
            }
            .md ul,
            .md ol {
                margin: 4px 0;
                padding-left: 20px;
            }
            .md a {
                color: var(--accent);
            }
            .md blockquote {
                border-left: 3px solid var(--line);
                margin: 4px 0;
                padding-left: 8px;
                color: var(--muted);
            }
            .inline-code {
                background: var(--bg);
                border: 1px solid var(--line);
                border-radius: 4px;
                padding: 0 4px;
                font-family: ui-monospace, monospace;
                font-size: 12px;
            }
            .codeblock {
                border: 1px solid var(--line);
                border-radius: 8px;
                overflow: hidden;
                margin: 6px 0;
            }
            .cb-head {
                display: flex;
                justify-content: space-between;
                align-items: center;
                background: var(--bg);
                padding: 3px 8px;
                font-size: 11px;
                color: var(--muted);
            }
            .cb-copy {
                background: none;
                border: 1px solid var(--line);
                color: var(--text);
                border-radius: 5px;
                padding: 1px 7px;
                cursor: pointer;
                font-size: 11px;
            }
            .codeblock pre {
                margin: 0;
                padding: 8px 10px;
                overflow-x: auto;
                background: #0c0c11;
            }
            body[data-theme="light"] .codeblock pre {
                background: #1c1c22;
            }
            .codeblock code {
                font-family: ui-monospace, monospace;
                font-size: 12px;
                color: #e7e7ee;
            }
            /* tool calls */
            .tool {
                background: var(--panel);
                border: 1px solid var(--line);
                border-radius: 8px;
                font-size: 12px;
            }
            .tool.running {
                border-color: var(--accent);
            }
            .tool-row {
                display: flex;
                align-items: center;
                gap: 7px;
                padding: 5px 9px;
                cursor: pointer;
            }
            .tool .tname {
                font-weight: 600;
                color: var(--accent);
            }
            .tool .tsum {
                color: var(--muted);
                overflow: hidden;
                text-overflow: ellipsis;
                white-space: nowrap;
            }
            .tool .tchev {
                margin-left: auto;
                color: var(--muted);
            }
            .tspin {
                width: 11px;
                height: 11px;
                border: 2px solid var(--line);
                border-top-color: var(--accent);
                border-radius: 50%;
                animation: spin 0.7s linear infinite;
            }
            @keyframes spin {
                to {
                    transform: rotate(360deg);
                }
            }
            .targs {
                margin: 0;
                padding: 6px 9px;
                border-top: 1px solid var(--line);
                font-size: 11px;
                white-space: pre-wrap;
                word-break: break-all;
                color: var(--muted);
            }
            .typing {
                display: flex;
                gap: 4px;
                padding: 4px 0;
            }
            .typing span {
                width: 6px;
                height: 6px;
                border-radius: 50%;
                background: var(--muted);
                animation: blink 1.2s infinite both;
            }
            .typing span:nth-child(2) {
                animation-delay: 0.2s;
            }
            .typing span:nth-child(3) {
                animation-delay: 0.4s;
            }
            @keyframes blink {
                0%,
                80%,
                100% {
                    opacity: 0.2;
                }
                40% {
                    opacity: 1;
                }
            }
            .scrolldown {
                position: absolute;
                right: 14px;
                bottom: 70px;
                width: 30px;
                height: 30px;
                border-radius: 50%;
                border: 1px solid var(--line);
                background: var(--panel);
                color: var(--text);
                cursor: pointer;
                box-shadow: 0 4px 14px rgba(0, 0, 0, 0.4);
            }
            .lightbox {
                position: fixed;
                inset: 0;
                background: rgba(0, 0, 0, 0.85);
                display: flex;
                align-items: center;
                justify-content: center;
                z-index: 50;
                cursor: zoom-out;
            }
            .lightbox img {
                max-width: 96%;
                max-height: 96%;
                border-radius: 8px;
            }
            .autocomplete {
                border-top: 1px solid var(--line);
                background: var(--panel);
                max-height: 160px;
                overflow: auto;
            }
            .ac {
                padding: 5px 10px;
                cursor: pointer;
                font-size: 12px;
            }
            .ac:hover {
                background: var(--bg);
            }
            .ac .acarg {
                color: var(--accent);
            }
            .ac .acs {
                color: var(--muted);
                margin-left: 6px;
            }
            .composer {
                display: flex;
                gap: 6px;
                padding: 8px;
                border-top: 1px solid var(--line);
                background: var(--panel);
            }
            .composer textarea {
                flex: 1;
                min-height: 38px;
                max-height: 120px;
                resize: none;
                background: var(--bg);
                color: var(--text);
                border: 1px solid var(--line);
                border-radius: 8px;
                padding: 8px;
                font: inherit;
            }
            .composer button {
                flex: 0 0 38px;
                width: 38px;
                height: 38px;
                align-self: flex-end;
                border: 0;
                border-radius: 50%;
                cursor: pointer;
                font-weight: 700;
                font-size: 16px;
            }
            .go {
                background: var(--accent);
                color: #fff;
            }
            .stop {
                background: var(--danger);
                color: #fff;
            }
            .thinking {
                color: var(--muted);
            }
            /* resize handle */
            .resize-handle {
                position: absolute;
                left: 0;
                top: 0;
                width: 5px;
                height: 100%;
                cursor: ew-resize;
                z-index: 30;
            }
            .resize-handle:hover {
                background: color-mix(in srgb, var(--accent) 40%, transparent);
            }
            /* status pill */
            .pill {
                font-size: 10px;
                padding: 1px 7px;
                border-radius: 10px;
                font-weight: 600;
                vertical-align: middle;
                margin-left: 4px;
            }
            .pill.idle {
                background: color-mix(in srgb, var(--muted) 22%, transparent);
                color: var(--muted);
            }
            .pill.working {
                background: color-mix(in srgb, var(--accent) 22%, transparent);
                color: var(--accent);
            }
            .pill.paused {
                background: color-mix(in srgb, var(--danger) 22%, transparent);
                color: var(--danger);
            }
            .pill.connecting {
                background: color-mix(in srgb, var(--muted) 18%, transparent);
                color: var(--muted);
            }
            /* context meter */
            .ctxmeter {
                display: flex;
                align-items: center;
                gap: 4px;
            }
            .ctxbar {
                width: 44px;
                height: 5px;
                border-radius: 3px;
                background: var(--line);
                overflow: hidden;
            }
            .ctxfill {
                height: 100%;
                transition: width 0.4s ease;
            }
            .ctxnum {
                font-size: 10px;
                color: var(--muted);
            }
            /* thinking block */
            .thinking-block {
                border: 1px dashed var(--line);
                border-radius: 8px;
                background: color-mix(in srgb, var(--muted) 6%, transparent);
            }
            .thinking-block.live {
                border-color: var(--accent);
            }
            .tb-row {
                display: flex;
                align-items: center;
                gap: 7px;
                padding: 5px 9px;
                cursor: pointer;
                font-size: 12px;
                color: var(--muted);
            }
            .tb-label {
                font-style: italic;
            }
            .tb-body {
                padding: 0 9px 8px;
                font-size: 12px;
                color: var(--muted);
                white-space: pre-wrap;
                max-height: 220px;
                overflow: auto;
            }
            /* message actions */
            .msg-actions {
                display: flex;
                gap: 4px;
                opacity: 0;
                transition: opacity 0.15s;
            }
            .msg.assistant:hover .msg-actions {
                opacity: 1;
            }
            .msg-actions button {
                background: var(--panel);
                border: 1px solid var(--line);
                color: var(--muted);
                border-radius: 6px;
                width: 24px;
                height: 22px;
                cursor: pointer;
                font-size: 12px;
            }
            .msg-actions button:hover {
                color: var(--text);
                border-color: var(--accent);
            }
            /* error card */
            .errcard {
                display: flex;
                align-items: center;
                justify-content: space-between;
                gap: 8px;
                background: color-mix(in srgb, var(--danger) 14%, transparent);
                border: 1px solid var(--danger);
                border-radius: 8px;
                padding: 8px 10px;
                font-size: 12px;
            }
            .errcard button {
                background: var(--danger);
                color: #fff;
                border: 0;
                border-radius: 6px;
                padding: 3px 10px;
                cursor: pointer;
            }
            /* markdown tables + highlight */
            .md-table {
                border-collapse: collapse;
                width: 100%;
                font-size: 12px;
                margin: 6px 0;
            }
            .md-table th,
            .md-table td {
                border: 1px solid var(--line);
                padding: 4px 8px;
                text-align: left;
            }
            .md-table th {
                background: var(--bg);
            }
            .hl-kw {
                color: #c792ea;
            }
            .hl-str {
                color: #c3e88d;
            }
            .hl-num {
                color: #f78c6c;
            }
            .hl-com {
                color: #6a6a76;
                font-style: italic;
            }
            /* settings popover */
            .settings-pop {
                position: fixed;
                inset: 0;
                background: rgba(0, 0, 0, 0.4);
                z-index: 45;
                display: flex;
                align-items: flex-start;
                justify-content: center;
                padding-top: 56px;
            }
            .sp-panel {
                width: 280px;
                background: var(--panel);
                border: 1px solid var(--line);
                border-radius: 12px;
                box-shadow: 0 12px 40px rgba(0, 0, 0, 0.5);
                padding: 12px;
            }
            .sp-head {
                display: flex;
                justify-content: space-between;
                align-items: center;
                margin-bottom: 10px;
            }
            .sp-head button {
                background: none;
                border: 0;
                color: var(--muted);
                cursor: pointer;
                font-size: 14px;
            }
            .sp-field {
                display: flex;
                flex-direction: column;
                gap: 4px;
                margin-bottom: 12px;
            }
            .sp-field input[type="range"] {
                width: 100%;
            }
            .sp-field small {
                color: var(--muted);
            }
            .sp-check {
                display: flex;
                align-items: center;
                gap: 8px;
                font-size: 12px;
                margin-bottom: 10px;
            }
            .sp-note {
                font-size: 11px;
                color: var(--muted);
                margin: 6px 0 0;
            }
            /* activity panel */
            .activity {
                position: fixed;
                inset: 0;
                background: rgba(0, 0, 0, 0.4);
                z-index: 40;
                display: flex;
                justify-content: flex-end;
            }
            .act-panel {
                width: 280px;
                background: var(--panel);
                border-left: 1px solid var(--line);
                display: flex;
                flex-direction: column;
            }
            .act-head {
                display: flex;
                justify-content: space-between;
                align-items: center;
                padding: 10px 12px;
                border-bottom: 1px solid var(--line);
            }
            .act-head button {
                background: none;
                border: 0;
                color: var(--muted);
                cursor: pointer;
                font-size: 14px;
            }
            .act-list {
                overflow: auto;
                flex: 1;
            }
            .act-empty {
                padding: 14px;
                color: var(--muted);
                font-size: 12px;
            }
            .act-row {
                display: flex;
                align-items: center;
                gap: 8px;
                padding: 6px 12px;
                border-bottom: 1px solid var(--line);
                font-size: 12px;
            }
            .act-dec {
                width: 14px;
                text-align: center;
            }
            .act-row.deny .act-dec {
                color: var(--danger);
            }
            .act-row.redirect .act-dec {
                color: var(--accent);
            }
            .act-tool {
                font-weight: 600;
            }
            .act-risk {

            .act-time {

    </head>
