<!DOCTYPE html>
<html lang="en" data-theme="dark">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Terminal</title>
        <link rel="stylesheet" href="xterm.css" />
        <style>
            /* Design tokens mirrored from console.css so the terminal matches the app.
               Both palettes, because the console posts its theme to this frame and
               this page used to ignore it — the console went light and the panel
               beside it stayed black. The xterm canvas is painted by JS rather
               than CSS, so terminal/main.ts carries the matching pair. */
            :root {
                color-scheme: dark;
                --background: #0a0a0c;
                --foreground: #ededf1;
                --card: #121216;
                --muted-foreground: #8a8a95;
                --secondary: #1a1a20;
                --accent: #23232b;
                --border: #26262e;
                --primary: #5b8cff;
                --ok: #46c773;
                --danger: #f25555;
                --radius: 7px;
            }
            :root[data-theme="light"] {
                color-scheme: light;
                --background: #eef0f4;
                --foreground: #17171c;
                --card: #ffffff;
                --muted-foreground: #666672;
                --secondary: #f1f2f6;
                --accent: #e6e7ee;
                --border: #dcdde4;
                --primary: #3b6ef0;
                --ok: #2faa5b;
                --danger: #d6453f;
            }
            html,
            body {
                height: 100%;
                margin: 0;
                overflow: hidden;
                background: var(--background);
                color: var(--foreground);
                font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
            }
            body {
                display: flex;
                flex-direction: column;
                min-width: 0;
                min-height: 0;
            }
            /* ---- tab bar ---- */
            #tabs {
                display: flex;
                align-items: center;
                gap: 4px;
                height: 36px;
                min-height: 36px;
                padding: 0 8px;
                box-sizing: border-box;
                background: color-mix(in srgb, var(--card) 94%, #000);
                border-bottom: 1px solid var(--border);
                overflow: hidden;
            }
            /* Both sit at the right of the row and never both at once. They
               ellipsise rather than push, so a narrow panel loses the end of a
               sentence (the tooltip keeps it) instead of overflowing the frame. */
            #term-status,
            #term-hint {
                margin-left: auto;
                padding-right: 4px;
                /* The tab strip yields first: it scrolls, so space taken from
                   it costs nothing, while an ellipsised sentence costs its end.
                   Left to shrink proportionally the hint came out 45px wide —
                   "Esc…" — beside 298px of tabs. The cap keeps room for New
                   shell and a tab to stay visible when the panel is narrow. */
                flex: 0 0 auto;
                max-width: calc(100% - 104px);
                overflow: hidden;
                font-size: 11px;
                white-space: nowrap;
                text-overflow: ellipsis;
            }
            #term-status {
                color: var(--danger);
            }
            #term-hint {
                color: var(--muted-foreground);
            }
            /* Read, never seen: the same advice as #term-hint, hung off the
               terminal's own description so a screen reader gets it on focus. */
            .sr-only {
                position: absolute;
                width: 1px;
                height: 1px;
                margin: -1px;
                padding: 0;
                overflow: hidden;
                clip-path: inset(50%);
                white-space: nowrap;
            }
            /* Only the tabs scroll. The strip used to scroll as a whole, which
               put everything after the tabs — New shell, the disconnect notice,
               the escape-hatch hint — off the right edge as soon as there were
               enough shells to overflow. Measured with eleven open: the hint was
               a single letter at the edge and the notice was past it entirely.
               flex 0 1 auto rather than 1, so New shell still sits just after
               the last tab when there is room, instead of pinning right. */
            #tablist {
                display: flex;
                align-items: center;
                gap: 4px;
                flex: 0 1 auto;
                min-width: 0;
                overflow-x: auto;
                overflow-y: hidden;
                scrollbar-width: none;
            }
            #tablist::-webkit-scrollbar {
                display: none;
            }
            .tab {
                position: relative;
                display: flex;
                align-items: center;
                gap: 8px;
                height: 28px;
                min-width: 72px;
                max-width: 210px;
                padding: 0 6px 0 9px;
                border: 1px solid transparent;
                border-radius: 6px;
                background: transparent;
                color: var(--muted-foreground);
                font-size: 12px;
                font-weight: 550;
                cursor: default;
                user-select: none;
                white-space: nowrap;
                transition:
                    background 0.12s,
                    border-color 0.12s,
                    color 0.12s;
            }
            .tab:hover {
                background: color-mix(in srgb, var(--secondary) 78%, transparent);
                color: var(--foreground);
            }
            .tab.active {
                background: var(--secondary);
                border-color: color-mix(in srgb, var(--border) 84%, var(--foreground));
                color: var(--foreground);
            }
            /* The strip is keyboard-navigable, so the focused tab has to be
               findable — and its close button has to stop being invisible, since
               Delete is the only way to reach it. */
            .tab:focus-visible {
                outline: none;
                border-color: var(--primary);
                box-shadow: 0 0 0 3px color-mix(in srgb, var(--primary) 32%, transparent);
                color: var(--foreground);
            }
            .tab .label {
                flex: 1;
                min-width: 0;
                overflow: hidden;
                text-overflow: ellipsis;
            }
            /* Two markers on the same slot: the tab holding the KVM control
               lease, and a tab whose shell has exited.
               .exited was toggled but never drawn, so ten tabs with three dead
               ones among them all looked alike, and the only way to find a dead
               shell was to click into it and read the last line. The word is the
               cue, not the colour — dimming the label instead was measured at
               2.4:1 to 3.6:1, which is unreadable rather than subdued.
               Both are mixed toward the foreground because the raw tokens are
               3.85:1 (danger) and 3.94:1 (primary) on the light-theme strip:
               under AA for text this size. Mixed and measured they are 4.59 and
               4.53 there, 4.69 and 4.63 on the active tab, higher in dark. */
            .tab .ctrl,
            .tab .dead {
                display: none;
                flex: none;
                font-size: 10px;
                font-weight: 700;
                line-height: 1;
                text-transform: uppercase;
            }
            .tab .ctrl {
                color: color-mix(in srgb, var(--primary) 90%, var(--foreground));
            }
            .tab .dead {
                color: color-mix(in srgb, var(--danger) 88%, var(--foreground));
            }
            .tab.controlling .ctrl,
            .tab.exited .dead {
                display: inline;
            }
            .tab.controlling {
                border-color: color-mix(in srgb, var(--primary) 45%, var(--border));
            }
            /* Dashed, not red: a shell exiting is ordinary, not an error, and a
               strip of red-outlined tabs reads as alarm. The dashes carry "this
               one is finished" on their own; the word carries the meaning. */
            .tab.exited {
                border-style: dashed;
                border-color: color-mix(in srgb, var(--foreground) 22%, var(--border));
            }
            .tab .close {
                display: flex;
                padding: 0;
                border: none;
                background: transparent;
                font: inherit;
                cursor: default;
                align-items: center;
                justify-content: center;
                width: 18px;
                height: 18px;
                font-size: 13px;
                border-radius: 5px;
                color: var(--muted-foreground);
                flex: none;
                opacity: 0;
                transition:
                    background 0.12s,
                    color 0.12s,
                    opacity 0.12s;
            }
            .tab:hover .close,
            .tab:focus-visible .close,
            .tab.active .close {
                opacity: 0.72;
            }
            .tab .close:hover {
                background: var(--accent);
                color: var(--foreground);
                opacity: 1;
            }
            #new-tab {
                display: flex;
                align-items: center;
                justify-content: center;
                width: 30px;
                height: 28px;
                margin: 0 0 0 2px;
                border-radius: 6px;
                background: transparent;
                color: var(--muted-foreground);
                border: none;
                font-size: 17px;
                line-height: 1;
                cursor: default;
                flex: none;
            }
            #new-tab:hover {
                background: var(--secondary);
                color: var(--foreground);
            }
            /* ---- terminals ---- */
            #terms {
                position: relative;
                flex: 1;
                min-height: 0;
                overflow: hidden;
            }
            .term {
                position: absolute;
                inset: 0;
                /* No right padding: the slim scrollbar sits at the edge, not in a gap. */
                padding: 10px 3px 8px 12px;
                box-sizing: border-box;
                display: none;
                overflow: hidden;
            }
            .term.active {
                display: block;
            }
            .term .xterm {
                width: 100%;
                height: 100%;
                overflow: hidden;
            }
            .xterm .xterm-viewport {
                background: transparent !important;
                overflow-x: hidden !important;
                overflow-y: auto !important;
                scrollbar-width: thin;
                scrollbar-color: color-mix(in srgb, var(--accent) 82%, transparent) transparent;
            }
            .xterm .xterm-viewport::-webkit-scrollbar {
                width: 8px;
            }
            .xterm .xterm-viewport::-webkit-scrollbar-button {
                display: none;
                width: 0;
                height: 0;
            }
            .xterm .xterm-viewport::-webkit-scrollbar-track {
                background: transparent;
            }
            .xterm .xterm-viewport::-webkit-scrollbar-thumb {
                background: var(--accent);
                border-radius: 999px;
                border: 2px solid transparent;
                background-clip: padding-box;
            }
            .xterm .xterm-viewport::-webkit-scrollbar-thumb:hover {
                background: #34343f;
                background-clip: padding-box;
            }
            .xterm .xterm-viewport::-webkit-scrollbar-corner {
                background: transparent;
            }
        </style>
    </head>
    <body>
        <div id="tabs">
            <!-- The tabs live in their own role=tablist rather than on #tabs itself:
                 a tablist may only own tabs, and this strip also carries the New
                 shell button and the status text. -->
            <div id="tablist" role="tablist" aria-label="Terminal sessions"></div>
            <button id="new-tab" title="New shell" aria-label="New shell">+</button>
            <!-- Said out loud, because losing the socket used to be silent: New
                 shell simply stopped doing anything and nothing on screen said
                 why. role=status so it is announced when it appears, and empty
                 while the connection is healthy so there is nothing to read. -->
            <span id="term-status" role="status" aria-live="polite" hidden></span>
            <!-- The way out of the terminal, shown only to whoever needs it: on
                 screen when focus arrived from the keyboard, and always on the
                 helper textarea's description for screen readers. aria-hidden
                 here so the two are not read as one thing twice. -->
            <span id="term-hint" aria-hidden="true" hidden>Esc then Tab to leave the terminal</span></div>
        <span id="term-hatch" class="sr-only">Press Escape then Tab to move focus out of the terminal.</span>
        <div id="terms"></div>
        <script src="terminal.js"></script>
    </body>
</html>
