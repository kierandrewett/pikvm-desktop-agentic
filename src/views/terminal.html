<!DOCTYPE html>
<html lang="en" data-theme="dark">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Agent</title>
        <link rel="stylesheet" href="xterm.css" />
        <style>
            /* Design tokens mirrored from console.css so the terminal matches the app. */
            :root {
                --background: #0a0a0c;
                --foreground: #ededf1;
                --card: #121216;
                --muted-foreground: #8a8a95;
                --secondary: #1a1a20;
                --accent: #23232b;
                --border: #26262e;
                --primary: #5b8cff;
                --ok: #46c773;
                --danger: #f25555;
                --radius: 7px;
            }
            html,
            body {
                height: 100%;
                margin: 0;
                background: var(--background);
                color: var(--foreground);
                font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
            }
            body {
                display: flex;
                flex-direction: column;
            }
            /* ---- tab bar ---- */
            #tabs {
                display: flex;
                align-items: center;
                gap: 2px;
                height: 38px;
                min-height: 38px;
                padding: 0 6px;
                box-sizing: border-box;
                background: var(--card);
                border-bottom: 1px solid var(--border);
                overflow-x: auto;
                overflow-y: hidden;
                scrollbar-width: none;
            }
            #tabs::-webkit-scrollbar {
                display: none;
            }
            .tab {
                display: flex;
                align-items: center;
                gap: 8px;
                padding: 0 7px 0 11px;
                height: 28px;
                max-width: 170px;
                border-radius: var(--radius);
                color: var(--muted-foreground);
                font-size: 12.5px;
                cursor: default;
                user-select: none;
                white-space: nowrap;
                box-shadow: inset 0 0 0 1px transparent;
                transition:
                    background 0.12s,
                    color 0.12s;
            }
            .tab:hover {
                background: var(--secondary);
                color: var(--foreground);
            }
            .tab.active {
                background: var(--background);
                color: var(--foreground);
                box-shadow: inset 0 0 0 1px var(--border);
            }
            .tab .label {
                overflow: hidden;
                text-overflow: ellipsis;
            }
            /* "Controls the KVM" badge — shown only on the tab that holds the control lease. */
            .tab .ctrl {
                display: none;
                flex: none;
                font-size: 11px;
                line-height: 1;
                color: var(--primary);
            }
            .tab.controlling .ctrl {
                display: inline;
            }
            .tab.controlling {
                box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--primary) 55%, transparent);
            }
            .tab .dot {
                width: 6px;
                height: 6px;
                border-radius: 50%;
                background: var(--ok);
                flex: none;
                box-shadow: 0 0 6px -1px var(--ok);
            }
            .tab.exited .dot {
                background: var(--muted-foreground);
                box-shadow: none;
            }
            .tab .close {
                width: 17px;
                height: 17px;
                line-height: 15px;
                text-align: center;
                font-size: 13px;
                border-radius: 5px;
                color: var(--muted-foreground);
                flex: none;
                opacity: 0.65;
            }
            .tab .close:hover {
                background: var(--accent);
                color: var(--foreground);
                opacity: 1;
            }
            #new-tab {
                display: flex;
                align-items: center;
                justify-content: center;
                width: 26px;
                height: 26px;
                margin-left: 2px;
                border-radius: var(--radius);
                background: transparent;
                color: var(--muted-foreground);
                border: none;
                font-size: 17px;
                line-height: 1;
                cursor: default;
                flex: none;
            }
            #new-tab:hover {
                background: var(--secondary);
                color: var(--foreground);
            }
            /* ---- agent picker (the + menu) ---- */
            .agent-picker {
                position: fixed;
                z-index: 9999;
                min-width: 140px;
                padding: 4px;
                background: var(--card);
                border: 1px solid var(--border);
                border-radius: 9px;
                box-shadow: 0 12px 34px rgba(0, 0, 0, 0.55);
            }
            .agent-item {
                padding: 7px 10px;
                border-radius: 6px;
                font-size: 13px;
                color: var(--foreground);
                cursor: default;
            }
            .agent-item:hover {
                background: var(--secondary);
            }
            .agent-item::before {
                content: "";
                display: inline-block;
                width: 7px;
                height: 7px;
                border-radius: 50%;
                margin-right: 8px;
                vertical-align: middle;
                background: var(--muted-foreground);
            }
            .agent-item[data-agent="claude"]::before {
                background: #d98a5b;
            }
            .agent-item[data-agent="codex"]::before {
                background: var(--ok);
            }
            .agent-item[data-agent="opencode"]::before {
                background: var(--primary);
            }
            /* ---- terminals ---- */
            #terms {
                position: relative;
                flex: 1;
                min-height: 0;
            }
            .term {
                position: absolute;
                inset: 0;
                /* No right padding: the slim scrollbar sits at the edge, not in a gap. */
                padding: 8px 2px 6px 12px;
                box-sizing: border-box;
                display: none;
            }
            .term.active {
                display: block;
            }
            /* NOTE: do NOT set standard scrollbar-width/scrollbar-color here — when present,
               Chromium ignores the ::-webkit-scrollbar rules and draws a chunky default bar. */
            .xterm .xterm-viewport {
                background: transparent !important;
            }
            .xterm .xterm-viewport::-webkit-scrollbar {
                width: 9px;
            }
            .xterm .xterm-viewport::-webkit-scrollbar-button {
                display: none;
                width: 0;
                height: 0;
            }
            .xterm .xterm-viewport::-webkit-scrollbar-track {
                background: transparent;
            }
            .xterm .xterm-viewport::-webkit-scrollbar-thumb {
                background: var(--accent);
                border-radius: 999px;
                border: 2px solid transparent;
                background-clip: padding-box;
            }
            .xterm .xterm-viewport::-webkit-scrollbar-thumb:hover {
                background: #34343f;
                background-clip: padding-box;
            }
            .xterm .xterm-viewport::-webkit-scrollbar-corner {
                background: transparent;
            }
        </style>
    </head>
    <body>
        <div id="tabs"><button id="new-tab" title="New Claude session">+</button></div>
        <div id="terms"></div>
        <script src="terminal.js"></script>
    </body>
</html>
