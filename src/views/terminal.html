<!DOCTYPE html>
<html lang="en" data-theme="dark">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Terminal</title>
        <link rel="stylesheet" href="xterm.css" />
        <style>
            /* Design tokens mirrored from console.css so the terminal matches the app.
               Both palettes, because the console posts its theme to this frame and
               this page used to ignore it — the console went light and the panel
               beside it stayed black. The xterm canvas is painted by JS rather
               than CSS, so terminal/main.ts carries the matching pair. */
            :root {
                color-scheme: dark;
                --background: #0a0a0c;
                --foreground: #ededf1;
                --card: #121216;
                --muted-foreground: #8a8a95;
                --secondary: #1a1a20;
                --accent: #23232b;
                --border: #26262e;
                --primary: #5b8cff;
                --ok: #46c773;
                --danger: #f25555;
                --radius: 7px;
            }
            :root[data-theme="light"] {
                color-scheme: light;
                --background: #eef0f4;
                --foreground: #17171c;
                --card: #ffffff;
                --muted-foreground: #666672;
                --secondary: #f1f2f6;
                --accent: #e6e7ee;
                --border: #dcdde4;
                --primary: #3b6ef0;
                --ok: #18803d;
                --danger: #d6453f;
            }
            html,
            body {
                height: 100%;
                margin: 0;
                overflow: hidden;
                background: var(--background);
                color: var(--foreground);
                font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
            }
            body {
                display: flex;
                flex-direction: column;
                min-width: 0;
                min-height: 0;
            }
            /* ---- tab bar ---- */
            #tabs {
                display: flex;
                align-items: center;
                gap: 4px;
                height: 36px;
                min-height: 36px;
                padding: 0 8px;
                box-sizing: border-box;
                background: color-mix(in srgb, var(--card) 94%, #000);
                border-bottom: 1px solid var(--border);
                overflow-x: auto;
                overflow-y: hidden;
                scrollbar-width: none;
            }
            #tabs::-webkit-scrollbar {
                display: none;
            }
            .tab {
                position: relative;
                display: flex;
                align-items: center;
                gap: 8px;
                height: 28px;
                min-width: 72px;
                max-width: 210px;
                padding: 0 6px 0 9px;
                border: 1px solid transparent;
                border-radius: 6px;
                background: transparent;
                color: var(--muted-foreground);
                font-size: 12px;
                font-weight: 550;
                cursor: default;
                user-select: none;
                white-space: nowrap;
                transition:
                    background 0.12s,
                    border-color 0.12s,
                    color 0.12s;
            }
            .tab:hover {
                background: color-mix(in srgb, var(--secondary) 78%, transparent);
                color: var(--foreground);
            }
            .tab.active {
                background: var(--secondary);
                border-color: color-mix(in srgb, var(--border) 84%, var(--foreground));
                color: var(--foreground);
            }
            .tab .label {
                flex: 1;
                min-width: 0;
                overflow: hidden;
                text-overflow: ellipsis;
            }
            /* Shown only on the tab that holds the KVM control lease. */
            .tab .ctrl {
                display: none;
                flex: none;
                font-size: 10px;
                font-weight: 700;
                line-height: 1;
                color: var(--primary);
                text-transform: uppercase;
            }
            .tab.controlling .ctrl {
                display: inline;
            }
            .tab.controlling {
                border-color: color-mix(in srgb, var(--primary) 45%, var(--border));
            }
            .tab .close {
                display: flex;
                align-items: center;
                justify-content: center;
                width: 18px;
                height: 18px;
                font-size: 13px;
                border-radius: 5px;
                color: var(--muted-foreground);
                flex: none;
                opacity: 0;
                transition:
                    background 0.12s,
                    color 0.12s,
                    opacity 0.12s;
            }
            .tab:hover .close,
            .tab.active .close {
                opacity: 0.72;
            }
            .tab .close:hover {
                background: var(--accent);
                color: var(--foreground);
                opacity: 1;
            }
            #new-tab {
                display: flex;
                align-items: center;
                justify-content: center;
                width: 30px;
                height: 28px;
                margin: 0 0 0 2px;
                border-radius: 6px;
                background: transparent;
                color: var(--muted-foreground);
                border: none;
                font-size: 17px;
                line-height: 1;
                cursor: default;
                flex: none;
            }
            #new-tab:hover {
                background: var(--secondary);
                color: var(--foreground);
            }
            /* ---- terminals ---- */
            #terms {
                position: relative;
                flex: 1;
                min-height: 0;
                overflow: hidden;
            }
            .term {
                position: absolute;
                inset: 0;
                /* No right padding: the slim scrollbar sits at the edge, not in a gap. */
                padding: 10px 3px 8px 12px;
                box-sizing: border-box;
                display: none;
                overflow: hidden;
            }
            .term.active {
                display: block;
            }
            .term .xterm {
                width: 100%;
                height: 100%;
                overflow: hidden;
            }
            .xterm .xterm-viewport {
                background: transparent !important;
                overflow-x: hidden !important;
                overflow-y: auto !important;
                scrollbar-width: thin;
                scrollbar-color: color-mix(in srgb, var(--accent) 82%, transparent) transparent;
            }
            .xterm .xterm-viewport::-webkit-scrollbar {
                width: 8px;
            }
            .xterm .xterm-viewport::-webkit-scrollbar-button {
                display: none;
                width: 0;
                height: 0;
            }
            .xterm .xterm-viewport::-webkit-scrollbar-track {
                background: transparent;
            }
            .xterm .xterm-viewport::-webkit-scrollbar-thumb {
                background: var(--accent);
                border-radius: 999px;
                border: 2px solid transparent;
                background-clip: padding-box;
            }
            .xterm .xterm-viewport::-webkit-scrollbar-thumb:hover {
                background: #34343f;
                background-clip: padding-box;
            }
            .xterm .xterm-viewport::-webkit-scrollbar-corner {
                background: transparent;
            }
        </style>
    </head>
    <body>
        <div id="tabs"><button id="new-tab" title="New shell" aria-label="New shell">+</button></div>
        <div id="terms"></div>
        <script src="terminal.js"></script>
    </body>
</html>
