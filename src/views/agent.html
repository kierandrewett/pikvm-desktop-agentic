<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Agent</title>
    <link rel="stylesheet" href="/_agent/agent.css" />
</head>
<body>
    <!-- Daemon-offline banner (shown when the proxy can't reach :47615). -->
    <div id="offline" class="offline" hidden>
        <strong>Agent daemon offline.</strong>
        <span>Start it with <code>pikvm-agent daemon</code> — retrying…</span>
    </div>

    <header class="bar">
        <form id="new-task" class="new-task" autocomplete="off">
            <input id="task-input" type="text" placeholder="Describe a task for the agent…" spellcheck="false" />
            <button id="task-start" type="submit">Start</button>
        </form>
        <!-- Emergency brake — always visible, halts every session immediately. -->
        <button id="panic-stop" type="button" class="panic" title="Emergency stop — halt all agent sessions immediately">■ STOP</button>
    </header>

    <section id="sessions" class="sessions" aria-label="Sessions">
        <div class="empty" id="sessions-empty">No sessions yet.</div>
        <ul id="sessions-list"></ul>
    </section>

    <section id="detail" class="detail" hidden>
        <div class="detail-head">
            <div class="detail-task" id="d-task">—</div>
            <div class="detail-meta">
                <span class="badge" id="d-status">—</span>
                <span id="d-steps" class="muted"></span>
            </div>
        </div>

        <!-- What the agent is doing RIGHT NOW (plain language, derived from status + trace). -->
        <div id="d-activity" class="activity">
            <span class="activity-spin" id="d-activity-spin" hidden></span>
            <span class="activity-icon" id="d-activity-icon"></span>
            <span class="activity-text" id="d-activity-text">…</span>
        </div>

        <div id="d-error" class="error-box" hidden></div>

        <div class="frame-wrap">
            <img id="d-frame" alt="latest frame" />
            <div id="d-frame-empty" class="frame-empty">no frame yet</div>
        </div>

        <div class="actions">
            <button id="d-continue" type="button">Continue</button>
            <button id="d-abort" type="button" class="danger">Abort</button>
        </div>

        <!-- Pending approval (shown only when the session needs one). -->
        <div id="approval" class="approval" hidden>
            <div class="approval-head">
                <span class="badge warn" id="a-risk">risk</span>
                <span class="approval-reason" id="a-reason"></span>
            </div>
            <pre class="approval-action" id="a-action"></pre>
            <div class="approval-actions">
                <input id="a-reason-input" type="text" placeholder="reason / instruction (optional)" />
                <button id="a-approve" type="button" class="primary">Approve</button>
                <button id="a-reject" type="button" class="danger">Reject</button>
            </div>
        </div>

        <div class="trace">
            <div class="trace-title">Activity log</div>
            <ol id="d-trace" class="trace-list"></ol>
        </div>
    </section>

    <script src="/_agent/agent.js"></script>
</body>
</html>
