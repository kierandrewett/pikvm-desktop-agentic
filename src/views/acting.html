<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <style>
            html,
            body {
                margin: 0;
                height: 100%;
                overflow: hidden;
                font: 13px system-ui, -apple-system, sans-serif;
                user-select: none;
            }
            #scrim {
                position: fixed;
                inset: 0;
                box-shadow: inset 0 0 0 3px #6c8cff,
                    inset 0 0 40px color-mix(in srgb, #6c8cff 45%, transparent);
                background: color-mix(in srgb, #6c8cff 6%, transparent);
                display: flex;
                align-items: flex-start;
                justify-content: center;
                animation: pulse 2s ease-in-out infinite;
            }
            @keyframes pulse {
                0%,
                100% {
                    box-shadow: inset 0 0 0 3px #6c8cff,
                        inset 0 0 30px color-mix(in srgb, #6c8cff 35%, transparent);
                }
                50% {
                    box-shadow: inset 0 0 0 3px #8aa3ff,
                        inset 0 0 60px color-mix(in srgb, #6c8cff 55%, transparent);
                }
            }
            #bar {
                margin-top: 18px;
                display: flex;
                align-items: center;
                gap: 14px;
                background: rgba(15, 15, 20, 0.92);
                color: #e7e7ee;
                border: 1px solid #2b2b3a;
                border-radius: 12px;
                padding: 10px 12px 10px 16px;
                box-shadow: 0 8px 30px rgba(0, 0, 0, 0.5);
                -webkit-app-region: no-drag;
            }
            #label {
                display: flex;
                flex-direction: column;
                line-height: 1.25;
            }
            #label b {
                font-size: 13px;
            }
            #label span {
                font-size: 11px;
                color: #9a9aa8;
            }
            #dot {
                width: 9px;
                height: 9px;
                border-radius: 50%;
                background: #6c8cff;
                box-shadow: 0 0 0 0 rgba(108, 140, 255, 0.6);
                animation: dot 1.4s infinite;
            }
            @keyframes dot {
                0% {
                    box-shadow: 0 0 0 0 rgba(108, 140, 255, 0.55);
                }
                100% {
                    box-shadow: 0 0 0 10px rgba(108, 140, 255, 0);
                }
            }
            #stop {
                background: #ff4d4d;
                color: #fff;
                border: 0;
                border-radius: 9px;
                padding: 10px 18px;
                font-size: 13px;
                font-weight: 700;
                cursor: pointer;
                display: flex;
                align-items: center;
                gap: 8px;
            }
            #stop:hover {
                background: #ff6363;
            }
            #stop .sq {
                width: 11px;
                height: 11px;
                background: #fff;
                border-radius: 2px;
            }
            kbd {
                font: inherit;
                font-size: 10px;
                background: #2b2b3a;
                border-radius: 4px;
                padding: 1px 5px;
                color: #cfcfe0;
            }
        </style>
    </head>
    <body>
        <div id="scrim">
            <div id="bar">
                <div id="dot"></div>
                <div id="label">
                    <b>Agent is in control</b>
                    <span id="action">performing actions…</span>
                </div>
                <button id="stop" title="Stop the agent and take back control (Esc)">
                    <span class="sq"></span> Stop &amp; take control
                </button>
            </div>
        </div>
        <script>
            const stop = () => window.ui?.send?.("agent:stop");
            document.getElementById("stop").onclick = stop;
            window.addEventListener("keydown", (e) => {
                if (e.key === "Escape") stop();
            });
            window.ui?.on?.("overlay:acting", (info) => {
                const a = document.getElementById("action");
                if (a && info && info.action) a.textContent = info.action;
            });
        </script>
    </body>
</html>
