<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <style>
            html,
            body {
                margin: 0;
                height: 100%;
                overflow: hidden;
                font: 13px system-ui, -apple-system, sans-serif;
                user-select: none;
            }
            #scrim {
                position: fixed;
                inset: 0;
                box-shadow: inset 0 0 0 3px #6c8cff,
                    inset 0 0 40px color-mix(in srgb, #6c8cff 45%, transparent);
                background: color-mix(in srgb, #6c8cff 6%, transparent);
                display: flex;
                align-items: flex-start;
                justify-content: center;
                animation: pulse 2s ease-in-out infinite;
            }
            @keyframes pulse {
                0%,
                100% {
                    box-shadow: inset 0 0 0 3px #6c8cff,
                        inset 0 0 30px color-mix(in srgb, #6c8cff 35%, transparent);
                }
                50% {
                    box-shadow: inset 0 0 0 3px #8aa3ff,
                        inset 0 0 60px color-mix(in srgb, #6c8cff 55%, transparent);
                }
            }
            #bar {
                margin-top: 18px;
                display: flex;
                align-items: center;
                gap: 14px;
                background: rgba(15, 15, 20, 0.92);
                color: #e7e7ee;
                border: 1px solid #2b2b3a;
                border-radius: 12px;
                padding: 10px 12px 10px 16px;
                box-shadow: 0 8px 30px rgba(0, 0, 0, 0.5);
                -webkit-app-region: no-drag;
            }
            #label {
                display: flex;
                flex-direction: column;
                line-height: 1.25;
            }
            #label b {
                font-size: 13px;
            }
            #label span {
                font-size: 11px;
                color: #9a9aa8;
            }
            #context {
                margin-top: 2px;
                display: none;
                align-items: center;
                gap: 5px;
                font-size: 11px;
            }
            #context.show {
                display: inline-flex;
            }
            #context .cdot {
                width: 7px;
                height: 7px;
                border-radius: 50%;
                background: #6cd38a;
            }
            #context.sensitive {
                color: #ffd479;
            }
            #context.sensitive .cdot {
                background: #ffd479;
                box-shadow: 0 0 6px rgba(255, 212, 121, 0.9);
            }
            #dot {
                width: 9px;
                height: 9px;
                border-radius: 50%;
                background: #6c8cff;
                box-shadow: 0 0 0 0 rgba(108, 140, 255, 0.6);
                animation: dot 1.4s infinite;
            }
            @keyframes dot {
                0% {
                    box-shadow: 0 0 0 0 rgba(108, 140, 255, 0.55);
                }
                100% {
                    box-shadow: 0 0 0 10px rgba(108, 140, 255, 0);
                }
            }
            #stop {
                background: #ff4d4d;
                color: #fff;
                border: 0;
                border-radius: 9px;
                padding: 10px 18px;
                font-size: 13px;
                font-weight: 700;
                cursor: pointer;
                display: flex;
                align-items: center;
                gap: 8px;
            }
            #stop:hover {
                background: #ff6363;
            }
            #pause {
                background: #2b2b3a;
                color: #e7e7ee;
                border: 0;
                border-radius: 9px;
                padding: 10px 14px;
                font-size: 13px;
                font-weight: 600;
                cursor: pointer;
            }
            #pause:hover {
                background: #3a3a4c;
            }
            #stop .sq {
                width: 11px;
                height: 11px;
                background: #fff;
                border-radius: 2px;
            }
            kbd {
                font: inherit;
                font-size: 10px;
                background: #2b2b3a;
                border-radius: 4px;
                padding: 1px 5px;
                color: #cfcfe0;
            }
            /* AI cursor */
            #cursor {
                position: fixed;
                left: 50%;
                top: 50%;
                width: 26px;
                height: 26px;
                margin: -13px 0 0 -13px;
                border-radius: 50%;
                background: radial-gradient(
                    circle,
                    rgba(108, 140, 255, 0.95) 0%,
                    rgba(108, 140, 255, 0.35) 55%,
                    transparent 75%
                );
                box-shadow: 0 0 18px 6px rgba(108, 140, 255, 0.55);
                pointer-events: none;
                opacity: 0;
                transition: opacity 0.25s ease;
                z-index: 5;
                will-change: left, top;
            }
            #cursor.show {
                opacity: 1;
            }
            #cursor::after {
                content: "";
                position: absolute;
                inset: -8px;
                border: 2px solid rgba(108, 140, 255, 0.7);
                border-radius: 50%;
                animation: cursorpulse 1.5s ease-out infinite;
            }
            @keyframes cursorpulse {
                0% {
                    transform: scale(0.55);
                    opacity: 0.85;
                }
                100% {
                    transform: scale(2);
                    opacity: 0;
                }
            }
            .click-burst {
                position: fixed;
                width: 22px;
                height: 22px;
                margin: -11px 0 0 -11px;
                border: 2.5px solid #6c8cff;
                border-radius: 50%;
                pointer-events: none;
                z-index: 6;
                animation: burst 0.55s ease-out forwards;
            }
            @keyframes burst {
                0% {
                    transform: scale(0.5);
                    opacity: 1;
                }
                100% {
                    transform: scale(3.2);
                    opacity: 0;
                }
            }
            /* "What the agent is looking at" — a labelled, scanning region box,
               in amber so it reads as observation (distinct from the blue cursor). */
            .look-box {
                position: fixed;
                border: 2px solid #ffd479;
                border-radius: 6px;
                background: color-mix(in srgb, #ffd479 9%, transparent);
                box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.35), 0 0 16px rgba(255, 212, 121, 0.5);
                pointer-events: none;
                overflow: hidden;
                z-index: 4;
                opacity: 0;
                transition: opacity 0.18s ease;
            }
            .look-box.show {
                opacity: 1;
            }
            .look-box .look-tag {
                position: absolute;
                top: 0;
                left: 0;
                transform: translateY(-100%);
                font-size: 10px;
                font-weight: 700;
                background: #ffd479;
                color: #1a1407;
                border-radius: 5px 5px 5px 0;
                padding: 1px 6px;
                white-space: nowrap;
                box-shadow: 0 2px 8px rgba(0, 0, 0, 0.45);
            }
            .look-box .scan {
                position: absolute;
                left: 0;
                right: 0;
                height: 2px;
                top: 0;
                background: rgba(255, 212, 121, 0.9);
                box-shadow: 0 0 10px 1px rgba(255, 212, 121, 0.9);
                animation: scan 1s ease-in-out 1;
            }
            @keyframes scan {
                0% {
                    top: 0;
                    opacity: 0.2;
                }
                15% {
                    opacity: 1;
                }
                100% {
                    top: 100%;
                    opacity: 0.2;
                }
            }
            /* LLM-segmented region map: thin, persistent violet rectangles labelling
               the salient regions (windows, taskbar, AVD, terminal…). Violet keeps it
               distinct from amber (observation), teal (typing) and blue (pointer). */
            #regions {
                position: fixed;
                inset: 0;
                pointer-events: none;
                z-index: 2;
            }
            #regions .region-box {
                position: fixed;
                border: 1px solid rgba(167, 139, 250, 0.85);
                border-radius: 4px;
                background: color-mix(in srgb, #a78bfa 4%, transparent);
                box-shadow: inset 0 0 0 1px rgba(0, 0, 0, 0.18);
            }
            #regions .region-tag {
                position: absolute;
                top: 0;
                left: 0;
                font-size: 9px;
                font-weight: 700;
                background: rgba(167, 139, 250, 0.92);
                color: #160b2e;
                border-radius: 0 0 4px 0;
                padding: 0 5px;
                white-space: nowrap;
                max-width: 100%;
                overflow: hidden;
                text-overflow: ellipsis;
            }
            /* Watched typing — a teal box tracking the field, with a live progress
               bar. Teal = "machine verification", distinct from amber (observation)
               and blue (pointer). It morphs colour as it verifies / self-corrects. */
            #type-box {
                position: fixed;
                border: 2px solid #3dd7c8;
                border-radius: 6px;
                background: color-mix(in srgb, #3dd7c8 8%, transparent);
                box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.35), 0 0 16px rgba(61, 215, 200, 0.5);
                pointer-events: none;
                overflow: hidden;
                z-index: 4;
                opacity: 0;
                transition: opacity 0.18s ease, border-color 0.2s ease;
            }
            #type-box.show {
                opacity: 1;
            }
            #type-box.verifying {
                border-style: dashed;
                animation: typepulse 1s ease-in-out infinite;
            }
            #type-box.verified {
                border-color: #6cd38a;
                box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.35), 0 0 16px rgba(108, 211, 138, 0.5);
            }
            #type-box.correcting {
                border-color: #ff6b6b;
                box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.35), 0 0 16px rgba(255, 107, 107, 0.55);
            }
            @keyframes typepulse {
                0%,
                100% {
                    box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.35), 0 0 12px rgba(61, 215, 200, 0.4);
                }
                50% {
                    box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.35), 0 0 22px rgba(61, 215, 200, 0.7);
                }
            }
            #type-box .type-tag {
                position: absolute;
                top: 0;
                left: 0;
                transform: translateY(-100%);
                font-size: 10px;
                font-weight: 700;
                background: #3dd7c8;
                color: #062420;
                border-radius: 5px 5px 5px 0;
                padding: 1px 6px;
                white-space: nowrap;
                box-shadow: 0 2px 8px rgba(0, 0, 0, 0.45);
            }
            #type-box.verified .type-tag {
                background: #6cd38a;
                color: #06240f;
            }
            #type-box.correcting .type-tag {
                background: #ff6b6b;
                color: #2a0606;
            }
            #type-box .pbar {
                position: absolute;
                left: 0;
                bottom: 0;
                height: 3px;
                width: 0%;
                background: #3dd7c8;
                box-shadow: 0 0 8px 1px rgba(61, 215, 200, 0.9);
                transition: width 0.12s linear;
            }
            #type-box.verified .pbar {
                background: #6cd38a;
            }
        </style>
    </head>
    <body>
        <div id="cursor"></div>
        <div id="scrim">
            <div id="bar">
                <div id="dot"></div>
                <div id="label">
                    <b>Agent is in control</b>
                    <span id="action">performing actions…</span>
                    <span id="context"></span>
                </div>
                <button id="pause" title="Pause — take control temporarily, then resume">
                    ❚❚ Pause
                </button>
                <button id="stop" title="Stop the agent and take back control (Esc)">
                    <span class="sq"></span> Stop &amp; take control
                </button>
            </div>
        </div>
        <script>
            const stop = () => window.ui?.send?.("agent:stop");
            document.getElementById("stop").onclick = stop;
            document.getElementById("pause").onclick = () => window.ui?.send?.("agent:pause");
            window.addEventListener("keydown", (e) => {
                if (e.key === "Escape") stop();
            });
            window.ui?.on?.("overlay:acting", (info) => {
                const a = document.getElementById("action");
                if (a && info && info.action) a.textContent = info.action;
            });
            // Show the recognised app + whether the agent is in a sensitive area.
            window.ui?.on?.("overlay:context", (c) => {
                const el = document.getElementById("context");
                if (!el || !c || !c.app) return;
                el.classList.add("show");
                el.classList.toggle("sensitive", !!c.sensitive);
                const where = c.sensitive ? `${c.app} · sensitive — actions need approval` : c.app;
                el.innerHTML = '<span class="cdot"></span>' + String(where).replace(/[<>&]/g, "");
            });

            // Exaggerated AI cursor: lerp a glowing dot to the target, pulse on click.
            const cursor = document.getElementById("cursor");
            let cur = { x: innerWidth / 2, y: innerHeight / 2 };
            let tgt = { x: cur.x, y: cur.y };
            let raf = null;
            function lerp() {
                cur.x += (tgt.x - cur.x) * 0.16;
                cur.y += (tgt.y - cur.y) * 0.16;
                cursor.style.left = cur.x + "px";
                cursor.style.top = cur.y + "px";
                if (Math.abs(tgt.x - cur.x) > 0.4 || Math.abs(tgt.y - cur.y) > 0.4) {
                    raf = requestAnimationFrame(lerp);
                } else {
                    raf = null;
                }
            }
            window.ui?.on?.("overlay:cursor", (d) => {
                if (!d || !d.w || !d.h) return;
                const px = (d.x / d.w) * innerWidth;
                const py = (d.y / d.h) * innerHeight;
                tgt = { x: px, y: py };
                cursor.classList.add("show");
                if (!raf) raf = requestAnimationFrame(lerp);
                if (d.kind === "click" || d.kind === "double_click") {
                    const b = document.createElement("div");
                    b.className = "click-burst";
                    b.style.left = px + "px";
                    b.style.top = py + "px";
                    document.body.appendChild(b);
                    setTimeout(() => b.remove(), 600);
                }
            });

            // Region the agent is reading/looking at — draw a labelled scan box so
            // the user sees exactly what the agent is focused on.
            window.ui?.on?.("overlay:region", (d) => {
                if (!d || !d.w || !d.h) return;
                const x = (d.x / d.w) * innerWidth;
                const y = (d.y / d.h) * innerHeight;
                const w = Math.max(10, (d.width / d.w) * innerWidth);
                const h = Math.max(10, (d.height / d.h) * innerHeight);
                const box = document.createElement("div");
                box.className = "look-box";
                box.style.left = x + "px";
                box.style.top = y + "px";
                box.style.width = w + "px";
                box.style.height = h + "px";
                const tag = document.createElement("div");
                tag.className = "look-tag";
                tag.textContent = d.label || "Looking";
                box.appendChild(tag);
                const scan = document.createElement("div");
                scan.className = "scan";
                box.appendChild(scan);
                document.body.appendChild(box);
                requestAnimationFrame(() => box.classList.add("show"));
                const hold = d.hold || 1500;
                setTimeout(() => {
                    box.classList.remove("show");
                    setTimeout(() => box.remove(), 240);
                }, hold);
            });

            // LLM-segmented region map: persistent, thin labelled rectangles for the
            // salient regions (windows, taskbar, AVD, terminal…). Redrawn whenever a
            // fresh map arrives, scaled to the overlay (which already tracks the KVM).
            let regionsLayer = null;
            window.ui?.on?.("overlay:regions", (d) => {
                if (!d || !d.w || !d.h) return;
                if (!regionsLayer) {
                    regionsLayer = document.createElement("div");
                    regionsLayer.id = "regions";
                    document.body.appendChild(regionsLayer);
                }
                regionsLayer.textContent = "";
                for (const r of d.regions || []) {
                    const box = document.createElement("div");
                    box.className = "region-box";
                    box.style.left = (r.x / d.w) * innerWidth + "px";
                    box.style.top = (r.y / d.h) * innerHeight + "px";
                    box.style.width = Math.max(8, (r.width / d.w) * innerWidth) + "px";
                    box.style.height = Math.max(8, (r.height / d.h) * innerHeight) + "px";
                    const tag = document.createElement("div");
                    tag.className = "region-tag";
                    tag.textContent = (r.label || "Region") + (r.kind ? " · " + r.kind : "");
                    box.appendChild(tag);
                    regionsLayer.appendChild(box);
                }
            });

            // Watched typing X-ray: one persistent teal box that tracks the field,
            // fills a progress bar, and flips to verified/correcting in place.
            let typeBox = null;
            let typeHide = null;
            window.ui?.on?.("overlay:typing", (d) => {
                if (!d || !d.w || !d.h) return;
                if (!typeBox) {
                    typeBox = document.createElement("div");
                    typeBox.id = "type-box";
                    typeBox.innerHTML = '<div class="type-tag"></div><div class="pbar"></div>';
                    document.body.appendChild(typeBox);
                }
                if (typeHide) {
                    clearTimeout(typeHide);
                    typeHide = null;
                }
                const tag = typeBox.querySelector(".type-tag");
                const bar = typeBox.querySelector(".pbar");
                if (d.region) {
                    typeBox.style.left = (d.region.x / d.w) * innerWidth + "px";
                    typeBox.style.top = (d.region.y / d.h) * innerHeight + "px";
                    typeBox.style.width = Math.max(12, (d.region.width / d.w) * innerWidth) + "px";
                    typeBox.style.height = Math.max(10, (d.region.height / d.h) * innerHeight) + "px";
                }
                typeBox.classList.remove("verifying", "verified", "correcting");
                typeBox.classList.add("show");
                switch (d.phase) {
                    case "start":
                        tag.textContent = "Typing…";
                        bar.style.width = "0%";
                        break;
                    case "located":
                    case "progress":
                        tag.textContent = "Typing…";
                        if (typeof d.done === "number" && d.total)
                            bar.style.width = Math.min(100, Math.round((100 * d.done) / d.total)) + "%";
                        break;
                    case "verifying":
                        tag.textContent = "Verifying…";
                        typeBox.classList.add("verifying");
                        break;
                    case "verified":
                        tag.textContent = "Verified ✓";
                        typeBox.classList.add("verified");
                        break;
                    case "correcting":
                        tag.textContent =
                            d.reason === "no-focus"
                                ? "Not focused ✗"
                                : d.reason === "layout"
                                  ? "Layout slip — fixing ✗"
                                  : "Fixing ✗";
                        typeBox.classList.add("correcting");
                        break;
                    case "done":
                        tag.textContent = d.ok ? (d.corrected ? "Fixed ✓" : "Verified ✓") : "Check failed";
                        typeBox.classList.add(d.ok ? "verified" : "correcting");
                        bar.style.width = "100%";
                        typeHide = setTimeout(() => {
                            if (typeBox) typeBox.classList.remove("show");
                        }, 1500);
                        break;
                }
            });
        </script>
    </body>
</html>
