<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Rounded icons preview</title>
        <style>
            :root {
                --bg: #ffffff;
                --surface: #f5f5f4;
                --line: #e7e5e4;
                --text: #1c1917;
                --muted: #78716c;
                --ink: #1c1917;
                --ghost: #a8a29e;
                --source: #dc2626;
                --flag: #b45309;
                --flag-bg: #fef3c7;
                --big: 64px;
            }
            @media (prefers-color-scheme: dark) {
                :root {
                    --bg: #1c1917;
                    --surface: #292524;
                    --line: #44403c;
                    --text: #f5f5f4;
                    --muted: #a8a29e;
                    --ink: #f5f5f4;
                    --ghost: #57534e;
                    --source: #f87171;
                    --flag: #fcd34d;
                    --flag-bg: #422006;
                }
            }
            * {
                box-sizing: border-box;
            }
            body {
                margin: 0;
                padding: 16px;
                background: var(--bg);
                color: var(--text);
                font:
                    14px/1.4 system-ui,
                    sans-serif;
            }
            header {
                display: grid;
                gap: 8px;
                margin-bottom: 16px;
            }
            h1 {
                margin: 0;
                font-size: 18px;
            }
            .meta {
                color: var(--muted);
                font:
                    12px/1.5 ui-monospace,
                    monospace;
                overflow-wrap: anywhere;
            }
            .controls {
                display: flex;
                flex-wrap: wrap;
                gap: 12px;
                align-items: center;
            }
            .controls label {
                display: flex;
                gap: 6px;
                align-items: center;
            }
            input[type="search"],
            select {
                font: inherit;
                padding: 4px 8px;
                border: 1px solid var(--line);
                border-radius: 8px;
                background: var(--surface);
                color: var(--text);
            }
            .grid {
                display: grid;
                grid-template-columns: repeat(auto-fill, minmax(calc(3 * var(--big) + 150px), 1fr));
                gap: 12px;
            }
            .card {
                border: 1px solid var(--line);
                border-radius: 12px;
                padding: 10px;
                background: var(--surface);
                content-visibility: auto;
                contain-intrinsic-size: 340px 220px;
            }
            .card h2 {
                margin: 0 0 6px;
                font-size: 13px;
                display: flex;
                gap: 6px;
                align-items: baseline;
                flex-wrap: wrap;
            }
            .flags {
                font:
                    11px ui-monospace,
                    monospace;
                color: var(--flag);
                background: var(--flag-bg);
                border-radius: 4px;
                padding: 0 4px;
            }
            .row {
                display: grid;
                grid-template-columns: 44px repeat(3, var(--big)) repeat(2, 24px);
                gap: 8px;
                align-items: center;
                margin-top: 4px;
            }
            .row .label {
                color: var(--muted);
                font-size: 11px;
            }
            svg {
                display: block;
                color: var(--ink);
            }
            .overlay .rounded {
                fill: var(--ghost);
            }
            .overlay .source {
                fill: none;
                stroke: var(--source);
                stroke-width: 1px;
                vector-effect: non-scaling-stroke;
            }
            .legend {
                color: var(--muted);
                font-size: 12px;
            }
        </style>
    </head>
    <body>
        <header>
            <h1>Rounded icons preview</h1>
            <div class="meta" id="meta"></div>
            <div class="controls">
                <label>Search <input type="search" id="search" placeholder="name" /></label>
                <label
                    >Show
                    <select id="view">
                        <option value="focus">Focus set</option>
                        <option value="flagged">Flagged by checks</option>
                        <option value="all">All icons</option>
                    </select>
                </label>
                <span class="legend"
                    >Each row: source, rounded, overlay (rounded fill, source outline in red), source 24, rounded 24.
                    Add ?size=160 to the URL for larger cells.</span
                >
            </div>
        </header>
        <main class="grid" id="grid"></main>
        <script>
            const DATA = /*__DATA__*/ null;
            const BIG = Number(new URLSearchParams(location.search).get("size")) || 64;
            document.documentElement.style.setProperty("--big", `${BIG}px`);
            const svg = (size, ds, cls = "") =>
                `<svg class="${cls}" width="${size}" height="${size}" viewBox="0 0 256 256" fill="currentColor" aria-hidden="true">${ds
                    .map((d) => `<path d="${d}"/>`)
                    .join("")}</svg>`;
            const overlay = (src, out) =>
                `<svg class="overlay" width="${BIG}" height="${BIG}" viewBox="0 0 256 256" aria-hidden="true">${out
                    .map((d) => `<path class="rounded" d="${d}"/>`)
                    .join("")}${src.map((d) => `<path class="source" d="${d}"/>`).join("")}</svg>`;
            const card = (icon) => {
                const rows = Object.entries(icon.w)
                    .map(
                        ([w, [src, out]]) =>
                            `<div class="row"><span class="label">${w}</span>${svg(BIG, src)}${svg(BIG, out)}${overlay(src, out)}${svg(24, src)}${svg(24, out)}</div>`,
                    )
                    .join("");
                const flags = icon.f.length ? `<span class="flags">${icon.f.join(" ")}</span>` : "";
                return `<section class="card" id="icon-${icon.n}"><h2>${icon.n}${flags}</h2>${rows}</section>`;
            };
            const byName = new Map(DATA.icons.map((i) => [i.n, i]));
            const grid = document.getElementById("grid");
            const search = document.getElementById("search");
            const view = document.getElementById("view");
            document.getElementById("meta").textContent =
                `params ${JSON.stringify(DATA.params)} | summary ${JSON.stringify(DATA.summary)}`;
            const render = () => {
                const q = search.value.trim().toLowerCase();
                let list;
                if (view.value === "focus") list = DATA.focus.map((n) => byName.get(n)).filter(Boolean);
                else if (view.value === "flagged")
                    list = DATA.icons.filter((i) => i.f.some((f) => !f.includes("override")));
                else list = DATA.icons;
                if (q) list = (view.value === "focus" ? DATA.icons : list).filter((i) => i.n.toLowerCase().includes(q));
                grid.innerHTML = list.map(card).join("");
            };
            search.addEventListener("input", render);
            view.addEventListener("change", render);
            const params = new URLSearchParams(location.search);
            if (params.get("view")) view.value = params.get("view");
            if (params.get("q")) search.value = params.get("q");
            render();
        </script>
    </body>
</html>
